name: macos

# RFP-022 Supportability #2: "The modules work on both Linux and MacOS platforms." Linux is ci.yml and
# modules/scripts/release-local.sh; this workflow runs the light crates a user's machine runs and builds
# five of the six modules' .lgx for macOS (arm64) the way release-local.sh builds them for linux-amd64:
# modules/scripts/export.sh, `nix build .#lgx-portable`, `lgx verify`; the .lgx files are uploaded as
# artifacts. ferrata_updater_module is left out: it vendors the linux-x86_64 builds of
# logos-blockchain-circuits and rapidsnark (modules/scripts/stage-updater.sh), so it builds for x86-64
# Linux only. Groth16 wrapping still needs Linux x86 (docs/traceability.md, RFP-022 S.2), so the wrap is
# not run here.
#
# GitHub's macOS runners have BSD tar, sed and find, no GNU coreutils, and bash 3.2: every script these
# steps run is checked for GNU-only commands and bash-4 constructs by scripts/ci/check-portable.py (CI's
# links job), and was run under a FreeBSD userland with bash 3.2 (scripts/ci/README.md). Its first run
# (45110242235, at 907736e8) failed in Clippy (an unpinned stable toolchain) and in the relayer module's
# risc0-sys (Metal kernels compiled inside the Nix build); both are fixed below. Until a first green run it
# runs on pushes to main and when started by hand, one run per branch at a time, not on every pull request.
# Third-party actions are pinned by commit (the tag or branch they had on 23 November 2026 in the comment;
# checkout, cache and rust-toolchain at the commits ci.yml uses).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The light crates a user's machine runs (RFP-022 S.2): the root workspace (ferrata-core,
  # ferrata-spectests - the same commands and caches as ci.yml's `test` job; scripts/fetch-vectors.sh
  # extracts the vectors by name, as BSD tar does too, and hashes with shasum where sha256sum is absent)
  # and the bridge core ferrata-bridge-core.
  user-side:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Rust 1.93.0, the toolchain ci.yml pins: a new stable's Clippy cannot fail the job (the first run took
      # stable, Rust 1.100.0, whose unnecessary_map_or failed it). The workspace is also Clippy-clean under that
      # stable: Job::is_verified allows the lint, since the attestation program is built from it.
      - uses: dtolnay/rust-toolchain@2b28c52cef68d77e9a4de0b428559db37728c04f # 1.93.0
        with:
          components: clippy, rustfmt
          targets: riscv32im-unknown-none-elf
      # Only the downloaded vectors: vectors/acc-leaf.json is committed and must come from git.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vectors/v1.7.0-beta.4
            vectors/bls12-381-tests-v0.1.2
            vectors/ethereum-tests-c67e485
          key: vectors-consensus-specs-v1.7.0-beta.4-bls12-381-tests-v0.1.2-ethereum-tests-c67e485-v2
      - name: Fetch pinned spec vectors
        run: scripts/fetch-vectors.sh
      - name: Vectors, Helios oracle, adversarial suites, mainnet and Sepolia replays, nullifier demo
        run: cargo test --workspace --locked -- --nocapture
      - name: The bridge core the user side runs
        run: cargo test -p ferrata-bridge-core --locked
        working-directory: bridge
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: no_std build for the RISC Zero guest ISA
        run: cargo build -p ferrata-core --no-default-features --features zkcrypto --target riscv32im-unknown-none-elf --release --locked

  # Five modules as .lgx for macOS, the way modules/scripts/release-local.sh builds linux-amd64: export
  # each module as its own repository (export.sh, which stages the crates: LEZ's lee_core and, for the
  # relayer, the LEZ tree, from the upstream sources), `nix build .#lgx-portable` in it, then `lgx verify`
  # with the lgx tool of the pinned logos-package. Nix builds the crates itself, so no Rust or RISC Zero
  # toolchain is installed here. Nix flakes need a larger stack than a macOS runner's default. The relayer
  # links risc0-zkp's prover code only for the Groth16 step's input.json (risc0-groth16's `prove`) and never
  # proves in-process, so its flake skips RISC Zero's Metal kernels (RISC0_SKIP_BUILD_KERNELS), which
  # risc0-sys would compile on macOS with Xcode's tools and a cache under $HOME, neither of which Nix offers;
  # its CMakeLists.txt links Metal and the Objective-C runtime, which risc0-zkp's verifier objects reference.
  modules:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Cache the upstream sources (LEZ v0.4.0-rc1 1806e87, Logos Blockchain d480efc6)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/../upstream
          key: upstream-lez-1806e87-e3edf47-logos-blockchain-d480efc6
      - name: Fetch the upstream sources (the LEZ tree the attestation, bridge and relayer modules vendor parts of)
        run: scripts/fetch-upstream.sh
      - name: jq (export.sh reads metadata.json with it)
        run: command -v jq > /dev/null || brew install jq
      - name: Five modules as .lgx for macOS (export.sh, nix build .#lgx-portable, lgx verify)
        env:
          LGX_PACKAGE: github:logos-co/logos-package/4bdd9041ebfbd06c2b22134afdcd27fce8a43f3c
          MODULES: ferrata_attest_module ferrata_bridge_module ferrata_attestor_module ferrata_monitor_module ferrata_relayer_module
        run: |
          set -euo pipefail
          ulimit -s 65536 2>/dev/null || ulimit -s hard
          mkdir -p out/src out/dist
          nix build "$LGX_PACKAGE#lgx" -o out/lgx-tool
          export PATH="$PWD/out/lgx-tool/bin:$PATH"
          for m in $MODULES; do
            modules/scripts/export.sh "$m" "out/src/$m"
            (cd "out/src/$m" && nix build .#lgx-portable --print-out-paths --no-link > "$OLDPWD/out/out-$m.txt")
            built=$(find "$(grep -E '^/nix/store/[^ ]+$' "out/out-$m.txt" | tail -n 1)" -maxdepth 2 -name '*.lgx' | head -n 1)
            version=$(jq -r .version "out/src/$m/metadata.json")
            mkdir -p "out/dist/$m-v$version"
            lgx="$m-$version.lgx"
            cp "$built" "out/dist/$m-v$version/$lgx"
            chmod u+w "out/dist/$m-v$version/$lgx"
            lgx verify "out/dist/$m-v$version/$lgx"
          done
      - name: Upload the .lgx files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lgx-macos-arm64
          path: out/dist/**/*.lgx
          if-no-files-found: error
