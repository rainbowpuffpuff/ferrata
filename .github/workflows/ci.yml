name: ci

# Runs on every push, pull request and manual dispatch with `lez-harness` split across a 6-shard matrix; no job is
# skipped on any trigger (RFP-021 R.12 / A4 gate: CI passes on main with none skipped). The daily/manual unsharded
# backstop lives in `.github/workflows/lez-full.yml`.
on:
  push:
  pull_request:
  workflow_dispatch:

# Every run on main (push or workflow_dispatch) gets its own concurrency group keyed by github.run_id with
# cancel-in-progress false, so runs on main never queue behind or cancel/replace each other (in a shared group with
# default queue: single, a newer run cancels any pending run even when cancel-in-progress is false). On all other refs
# (feature branches, pull requests, tags), runs share group ci-<ref> with cancel-in-progress true, cancelling
# superseded pending and in-progress runs.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# A read-only token: no job writes to the repository or calls GitHub's API. Third-party actions are pinned by commit
# (the tag or branch they had on 22 November 2026 in the comment).
permissions:
  contents: read

# vault/foundry.toml keeps forge offline, so a build never fetches anything by itself; a fresh runner has no
# solc 0.8.26 yet, so here forge may fetch that one compiler (the version is pinned in foundry.toml).
env:
  FOUNDRY_OFFLINE: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
          targets: riscv32im-unknown-none-elf
      # Only the downloaded vectors: vectors/acc-leaf.json is committed and must come from git.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vectors/v1.7.0-beta.4
            vectors/bls12-381-tests-v0.1.2
            vectors/ethereum-tests-c67e485
          key: vectors-consensus-specs-v1.7.0-beta.4-bls12-381-tests-v0.1.2-ethereum-tests-c67e485-v2
      - name: Fetch pinned spec vectors
        run: scripts/fetch-vectors.sh
      # Includes the fast Helios 0.12.0 step-path oracle subset (crates/ferrata-spectests/tests/helios_step_oracle.rs:
      # pin check, all 321 recorded real updates, 33 official sync vectors [96 two-way + 15 post-force_update one-way],
      # 467 field/edge/SSZ-framing mutations, 17 bootstrap/store differential + 18 step-path-only wire/witness/job
      # refusals, 8 adoption key-root binding refusals, 45 re-signed edges, 400 random mutations); the full
      # 10,000-mutation sweep runs via scripts/helios-oracle-full.sh.
      - name: Vectors, Helios step-path oracle, adversarial suites, mainnet and Sepolia replays, end-to-end, nullifier demo
        run: cargo test --workspace --locked -- --nocapture
      - name: Format
        run: cargo fmt --all -- --check
      # unnecessary_map_or is allowed: with rust-version 1.85 clippy proposes is_none_or for ferrata-core's
      # Job::is_verified, code the deployed attestation program is built from (a change would move its image id).
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -A clippy::unnecessary_map_or
      # The root workspace's rust-version (1.85, measured) stays true.
      - name: Rust 1.85.0 (the root workspace's rust-version)
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: The root workspace builds with its declared minimum Rust
        run: cargo +1.85.0 check --workspace --locked
      - name: no_std build for the RISC Zero guest ISA
        run: cargo build -p ferrata-core --no-default-features --features zkcrypto --target riscv32im-unknown-none-elf --release --locked

  # The other directories (bench/, lez/, vault/, bridge/, checkpoint/) need RISC Zero's toolchain,
  # Foundry or upstream sources; their READMEs give the commands. Two of their checks run here
  # (docs/guides/ci.md): the bridge guests' witness independence and the end-to-end round trip.

  # SPEC-v2 §5.2, the zkVM step of bridge/scripts/check.sh: 64 random valid witnesses per guest
  # (release, claim), executed in r0vm; fails if a guest's cycle count depends on its witness.
  witness-independence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2b28c52cef68d77e9a4de0b428559db37728c04f # 1.93.0
      - name: Cache RISC Zero's toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.risc0
            ~/risc0-home-lez
          key: risc0-3.1.0-3.0.5-rust-1.88.0-1.91.1-cpp-2024.1.5-${{ hashFiles('scripts/ci/install-risc0.sh') }}
      - name: RISC Zero toolchains (rzup)
        env:
          GITHUB_TOKEN: ${{ github.token }} # rzup's GitHub API calls: the job's read-only token, not the 60-an-hour limit
        run: scripts/ci/install-risc0.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: bridge -> target
          shared-key: witness
      - name: Cycle counts independent of the witness (release and claim guests)
        run: scripts/ci/witness-independence.sh 64
      # The bridge core's own tests (bridge/scripts/check.sh's "core tests"): deposits, claims, burns and releases
      # natively, every single-field change of a claim or a burn refused (RFP-022 F.5, R.1).
      - name: The bridge core's tests
        working-directory: bridge
        run: cargo test -p ferrata-bridge-core --locked
      # RFP-022 Soft.2: voluntary disclosure, the library and its command (make, verify), and the replay of a recorded
      # run's public data (docs/privacy/disclosure-replay/): verified, and a one-byte change to a claim refused.
      - name: The disclosure library, its command and the recorded replay (bridge/crates/ferrata-disclose)
        working-directory: bridge
        run: cargo test -p ferrata-disclose --locked

  # One round trip, every step asserted (e2e/ci/README.md): the v5 vault under rule (B) on anvil with
  # the vault tests' mock verifier; LEZ v0.4.0-rc1's state transition in the harness (dev mode);
  # deposit, attestation, claim, burn, a rule (B) checkpoint by the guest over the zone's blocks,
  # release. No secret, nothing sent to any public network.
  roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      # No debug info, no incremental artefacts: cli/target is 13 GB with them, over the 10 GB of caches GitHub keeps.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space (the LEZ and Logos Blockchain builds need about 20 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h .
      - name: System libraries (libpcsclite for LEZ's wallet crates, protoc)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpcsclite-dev protobuf-compiler
      - uses: dtolnay/rust-toolchain@2b28c52cef68d77e9a4de0b428559db37728c04f # 1.93.0
      - name: Rust 1.98.1 (LEZ v0.4.0-rc1's toolchain; cli/ and checkpoint/fidelity)
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.3.6
      - name: Cache RISC Zero's toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.risc0
            ~/risc0-home-lez
          key: risc0-3.1.0-3.0.5-rust-1.88.0-1.91.1-cpp-2024.1.5-${{ hashFiles('scripts/ci/install-risc0.sh') }}
      - name: RISC Zero toolchains (rzup)
        env:
          GITHUB_TOKEN: ${{ github.token }} # rzup's GitHub API calls: the job's read-only token, not the 60-an-hour limit
        run: scripts/ci/install-risc0.sh
      - name: Cache the upstream sources (LEZ v0.4.0-rc1 1806e87, Logos Blockchain d480efc6)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/../upstream
          key: upstream-lez-1806e87-e3edf47-logos-blockchain-d480efc6
      - name: Fetch the upstream sources
        run: scripts/fetch-upstream.sh
      - name: Cache the vault's libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vault/lib
          key: vault-lib-forge-std-1.10.0-oz-5.4.0-risc0-ethereum-3.1.0
      # The LEZ build: LEZ's and Logos Blockchain's crates compiled in cli/target and checkpoint/target.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            bridge -> target
            checkpoint -> target
            cli -> target
          shared-key: roundtrip
          cache-on-failure: true
      - name: Cache the checked native archives (scripts/native-deps.json)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ferrata/native
          key: native-${{ hashFiles('scripts/native-deps.json') }}
      - name: Build (vault, release and rule (B) guests, ci_zone, the test)
        timeout-minutes: 90
        run: e2e/ci/run.sh build
      - name: Round trip
        timeout-minutes: 30
        run: e2e/ci/run.sh
      - name: The ferrata tool's own end-to-end test (cli/tests/e2e.sh)
        timeout-minutes: 20
        run: RISC0_HOME="$HOME/risc0-home-lez" cli/tests/e2e.sh
      # cli/tests/relayer.sh's offline part: the relayer library's tests (journals, the burn watch, temporary
      # failures, imported roots) and the gas drop's checks on a real receipt, no dev mode (RFP-022 R.6, U.3). Its
      # third test, tests/relayer_fork.rs, reads public Sepolia state for its fork and runs on the build box.
      # The gas drop by default (RFP-022 U.5, Priv.7): the network's relayer read from the sequencer's origin, only
      # 404/410 read as "none published", every other answer stopping the claim and the burn (cli/src/gasdrop_net.rs);
      # the gateway's offline job check on the recorded real receipt (relayer::tests, in `--lib relayer`).
      - name: The relayer's tests (library, gas drop, the network's relayer); the burn-counter journal's (cli/src/burns.rs, RFP-022 R.7)
        timeout-minutes: 30
        working-directory: cli
        run: |
          export RISC0_HOME="$HOME/risc0-home-lez"
          cargo test --locked --lib relayer
          cargo test --locked --lib gasdrop_net
          cargo test --locked --lib burns
          cargo test --locked --test gasdrop -- --nocapture
      # RFP-022 U.9: seqnet-chain, the chain service the mini-app's endpoints test runs inside Logos Core with
      # (e2e/endpoints), compiles with its feature, and its own checks run: a candidate sequencer's configuration
      # (src/bin/seqnet_chain.rs's tests; the live switch itself runs on the build box). Debug, as LEZ's state machine
      # refuses its test helpers in a release build. Local only.
      - name: The chain service's endpoint checks (RFP-022 U.9)
        timeout-minutes: 30
        working-directory: cli
        run: |
          export RISC0_HOME="$HOME/risc0-home-lez"
          cargo test --locked --features seqnet --bin seqnet-chain
      # RFP-021 R.5 and U.5: `ferrata attest` against a stand-in LEZ sequencer (LEZ's own block application on
      # 127.0.0.1) and a scripted Ethereum endpoint failing on demand, killed mid-command and run again with nothing
      # sent twice; LEZ's validity-window refusal of a stale checkpoint shown as code 53's message, on a real
      # sequencer's recorded refusal (the library's tests) and on the stand-in's (tests/attest_faults.rs). Local only.
      - name: The attestation CLI under a failing Ethereum endpoint and interruptions; a stale checkpoint as code 53 (RFP-021 R.5, U.5)
        timeout-minutes: 30
        working-directory: cli
        run: |
          export RISC0_HOME="$HOME/risc0-home-lez"
          vars=$(python3 -I ../scripts/fetch_native.py env)
          eval "$vars"
          cargo test --locked --lib attest
          RISC0_DEV_MODE=1 cargo test --locked --test attest_faults -- --nocapture

  # The LEZ suites (scripts/ci/lez-harness.sh): the attestation and bridge programs through LEZ v0.4.0-rc1's state
  # machine and fee settlement in the harness, every non-feature-gated target of lez/harness and lez/updater (lib unit
  # tests, bin unit tests, doc-tests, integration test binaries including red-team suites and recorded updater tests),
  # and the privacy suite end to end with its gate (scripts/privacy/run.sh, scripts/privacy/check-results.py), with the
  # guests in RISC Zero dev mode. Split across a 6-shard matrix (scripts/ci/lez-harness-shards.json; checked by
  # scripts/ci/check-lez-shards.py here and in `links`) so each shard builds and runs only its own targets; the
  # daily/manual unsharded backstop runs in `.github/workflows/lez-full.yml`. The target directory is not cached: GitHub
  # keeps 10 GB of caches per repository and the round trip's fill them; the toolchains and the upstream sources share
  # the round trip's cache entries. No secret, nothing sent to any network.
  lez-harness:
    name: lez-harness (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [harness-1, harness-2, harness-3, harness-4, updater-gate, updater-privacy]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the LEZ shard map (scripts/ci/check-lez-shards.py)
        run: python3 -I scripts/ci/check-lez-shards.py
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h .
      - uses: dtolnay/rust-toolchain@2b28c52cef68d77e9a4de0b428559db37728c04f # 1.93.0
      - name: Rust 1.98.1 (LEZ v0.4.0-rc1's toolchain, lez/rust-toolchain.toml)
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache RISC Zero's toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.risc0
            ~/risc0-home-lez
          key: risc0-3.1.0-3.0.5-rust-1.88.0-1.91.1-cpp-2024.1.5-${{ hashFiles('scripts/ci/install-risc0.sh') }}
      - name: RISC Zero toolchains (rzup)
        env:
          GITHUB_TOKEN: ${{ github.token }} # rzup's GitHub API calls: the job's read-only token, not the 60-an-hour limit
        run: scripts/ci/install-risc0.sh
      - name: Cache the upstream sources (LEZ v0.4.0-rc1 1806e87, Logos Blockchain d480efc6)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/../upstream
          key: upstream-lez-1806e87-e3edf47-logos-blockchain-d480efc6
      - name: Fetch the upstream sources
        run: scripts/fetch-upstream.sh
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.3.6
      - name: Cache the vault's libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vault/lib
          key: vault-lib-forge-std-1.10.0-oz-5.4.0-risc0-ethereum-3.1.0
      - name: Libraries (the privacy suite's Ethereum half)
        working-directory: vault
        run: '[ -d lib/risc0-ethereum ] || forge install --no-git foundry-rs/forge-std@v1.10.0 OpenZeppelin/openzeppelin-contracts@v5.4.0 risc0/risc0-ethereum@v3.1.0'
      - name: Build (shard ${{ matrix.shard }} and the guests)
        timeout-minutes: 45
        env:
          SHARD: ${{ matrix.shard }}
        run: scripts/ci/lez-harness.sh --shard "$SHARD" build
      - name: The LEZ suites, dev mode (shard ${{ matrix.shard }})
        timeout-minutes: 60
        env:
          SHARD: ${{ matrix.shard }}
        run: scripts/ci/lez-harness.sh --shard "$SHARD"

  # The names program of the test network (names/README.md; scripts/ci/names.sh): its wire crate's tests, the harness
  # suites tests/names.rs and tests/names_review.rs (feature `names`, listed as feature-gated in the shard map, so run
  # here), the IDL check and the JS resolver's and the CLI's tests. Not an RFP requirement. No secret, nothing sent to
  # any network but dependency fetches.
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h .
      - uses: dtolnay/rust-toolchain@2b28c52cef68d77e9a4de0b428559db37728c04f # 1.93.0
      - name: Rust 1.98.1 (LEZ v0.4.0-rc1's toolchain, lez/rust-toolchain.toml)
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache RISC Zero's toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.risc0
            ~/risc0-home-lez
          key: risc0-3.1.0-3.0.5-rust-1.88.0-1.91.1-cpp-2024.1.5-${{ hashFiles('scripts/ci/install-risc0.sh') }}
      - name: RISC Zero toolchains (rzup)
        env:
          GITHUB_TOKEN: ${{ github.token }} # rzup's GitHub API calls: the job's read-only token, not the 60-an-hour limit
        run: scripts/ci/install-risc0.sh
      - name: Cache the upstream sources (LEZ v0.4.0-rc1 1806e87, Logos Blockchain d480efc6)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/../upstream
          key: upstream-lez-1806e87-e3edf47-logos-blockchain-d480efc6
      - name: Fetch the upstream sources
        run: scripts/fetch-upstream.sh
      - name: Build (the names wire crate and suites, and the guests)
        timeout-minutes: 45
        run: scripts/ci/names.sh build
      - name: The names checks (wire, harness in dev mode, IDL, JS and CLI)
        timeout-minutes: 30
        run: scripts/ci/names.sh

  # The test network's messages programs (docs/design/messages.md): ferrata_msg (v1, live) and ferrata_msg_v2 in LEZ
  # v0.4.0-rc1's state machine and fee settlement (lez/harness/tests/messages*.rs, feature `msg`, guests in RISC Zero dev
  # mode: every reachable exit code, the clients' gas limits against measured worst cases, the review's findings failing
  # on v1 and passing on v2), their wire crates (the logic, the vectors shared with the JS library, the IDL's vectors),
  # the JS library's tests (among them an independent implementation against OpenSSL's ML-KEM values) and the IDL
  # generator's check. scripts/ci/lez-harness.sh leaves feature-gated tests out; this job runs these. No secret, nothing
  # sent to any network.
  msg:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The JS library and CLI (offline CLI processes against loopback RPC stand-ins)
        run: node --version && node --test deploy/testnet/web/msg/test/*.test.mjs
      - name: The web wallet's fee-payer line (the network's gas-drop relayer; RFP-022 U.5, Priv.7)
        run: node --test deploy/testnet/web/wallet/test/gasdrop.test.mjs
      - name: The IDLs are what idl/tools/msg_idl.py writes
        run: python3 -I idl/tools/msg_idl.py --check
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h .
      - uses: dtolnay/rust-toolchain@2b28c52cef68d77e9a4de0b428559db37728c04f # 1.93.0
      - name: Rust 1.98.1 (lez/rust-toolchain.toml)
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache RISC Zero's toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.risc0
            ~/risc0-home-lez
          key: risc0-3.1.0-3.0.5-rust-1.88.0-1.91.1-cpp-2024.1.5-${{ hashFiles('scripts/ci/install-risc0.sh') }}
      - name: RISC Zero toolchains (rzup)
        env:
          GITHUB_TOKEN: ${{ github.token }} # rzup's GitHub API calls: the job's read-only token, not the 60-an-hour limit
        run: scripts/ci/install-risc0.sh
      - name: Cache the upstream sources (LEZ v0.4.0-rc1 1806e87, Logos Blockchain d480efc6)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/../upstream
          key: upstream-lez-1806e87-e3edf47-logos-blockchain-d480efc6
      - name: Fetch the upstream sources (the messages guests build against LEZ v0.4.0-rc3)
        run: scripts/fetch-upstream.sh
      - name: The wire crates (logic, the vectors the JS library shares, the IDL's vectors)
        working-directory: lez
        run: cargo test -p ferrata-lez-msg-wire -p ferrata-lez-msg-v2-wire --locked
      - name: Both programs in LEZ's state machine, dev mode
        working-directory: lez
        timeout-minutes: 60
        run: |
          export RISC0_HOME="$HOME/risc0-home-lez" RISC0_DEV_MODE=1
          cargo test -p harness --features msg --locked --test messages --test messages_v2 --test messages_findings -- --nocapture

  # The watchers (monitor/README.md): the monitor's own tests, then its rehearsal on a local anvil chain
  # (monitor/tests/anvil-e2e.sh: rule (B) and rule (A) FerrataVault v5 deployments with the monitor's key as watcher;
  # wrong candidates cancelled in time, a SIGKILL and restart, a lost state file rescanned, a watcher without gas,
  # a clean shutdown). RFP-022 U.3, R.6, R.9. Nothing sent to any public network.
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2b28c52cef68d77e9a4de0b428559db37728c04f # 1.93.0
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.3.6
      - name: Cache the vault's libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vault/lib
          key: vault-lib-forge-std-1.10.0-oz-5.4.0-risc0-ethereum-3.1.0
      - name: Libraries
        working-directory: vault
        run: '[ -d lib/risc0-ethereum ] || forge install --no-git foundry-rs/forge-std@v1.10.0 OpenZeppelin/openzeppelin-contracts@v5.4.0 risc0/risc0-ethereum@v3.1.0'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: monitor -> target
      - name: The monitor's tests
        working-directory: monitor
        run: cargo test --locked
      - name: The watchers' rehearsal on anvil (monitor/tests/anvil-e2e.sh)
        working-directory: monitor
        run: MONITOR_E2E_OUT="$RUNNER_TEMP/monitor-e2e" bash tests/anvil-e2e.sh
      # RFP-022 R.6: --send-via logos against a stand-in for tx_sender_module (e2e/netfault/txsender_stub.py): what the
      # module did not broadcast goes the plain way at the number it burnt, and a send held behind a burnt number nobody
      # filled is followed by the same call at that number (L5, the gap fill).
      - name: The watcher's sends through tx_sender_module, its fallback and gap fill (monitor/tests/logos-fallback.sh)
        working-directory: monitor
        run: MONITOR_LF_OUT="$RUNNER_TEMP/logos-fallback" bash tests/logos-fallback.sh

  # The vault's Foundry suites (vault/README.md): unit, fuzz and invariant tests with the mock verifier, and
  # test/real/ with RISC Zero's real Groth16 verifier and committed real proofs. PrivacySuite is left out: it replays
  # target/privacy/scenario.json, which the LEZ half (lez/harness/tests/privacy_suite.rs) writes and this job does not
  # run; without that file it skips.
  vault:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.3.6
      - name: Cache the vault's libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vault/lib
          key: vault-lib-forge-std-1.10.0-oz-5.4.0-risc0-ethereum-3.1.0
      - name: Libraries
        working-directory: vault
        run: '[ -d lib/risc0-ethereum ] || forge install --no-git foundry-rs/forge-std@v1.10.0 OpenZeppelin/openzeppelin-contracts@v5.4.0 risc0/risc0-ethereum@v3.1.0'
      - name: The libraries are the trees vault/lib.lock pins (scripts/vault_libs.py)
        run: python3 -I scripts/vault_libs.py check
      - name: forge test
        working-directory: vault
        run: forge test --no-match-contract PrivacySuite
      # e2e/seqnet deploys the vault through these functions in every mode; DeployVault once refused them unnoticed.
      - name: e2e/seqnet's vault deployment (e2e/seqnet/vault.sh, on anvil)
        run: bash e2e/seqnet/test-vault-deploy.sh

  # The dependency policy (deny.toml) over every Rust workspace (scripts/deny_all.py): licences, bans and sources block,
  # and the workspaces that need the upstream sources (the root, cli, lez) must have passed, not been skipped (the trees
  # CI does not fetch, LEZ v0.3.1, spel and the unstaged module libraries, are skipped); advisories against
  # scripts/deny-advisories-baseline.txt are reported without blocking, so a new RustSec advisory does not turn main
  # red with no code change. cargo-deny from its release asset, checked by sha256.
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2b28c52cef68d77e9a4de0b428559db37728c04f # 1.93.0
      - name: Rust 1.98.1 (cargo metadata of LEZ's workspaces)
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: cargo-deny 0.20.2, its release asset checked
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cargo-deny.tgz" https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/cargo-deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-deny.tgz" -C "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
      - name: Cache the upstream sources (LEZ v0.4.0-rc1 1806e87, Logos Blockchain d480efc6)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/../upstream
          key: upstream-lez-1806e87-e3edf47-logos-blockchain-d480efc6
      - name: Fetch the upstream sources
        run: scripts/fetch-upstream.sh
      - name: Licences, bans and sources over every workspace; the root, cli and lez checked, not skipped
        run: python3 -I scripts/deny_all.py --advisories off | tee "$RUNNER_TEMP/deny.txt" && grep -q ' 0 failed, ' "$RUNNER_TEMP/deny.txt" && grep -q -E '^PASS +\. ' "$RUNNER_TEMP/deny.txt" && grep -q -E '^PASS +cli ' "$RUNNER_TEMP/deny.txt" && grep -q -E '^PASS +lez ' "$RUNNER_TEMP/deny.txt"
      - name: Advisories against the per-workspace baseline (reported, not blocking)
        continue-on-error: true
        run: python3 -I scripts/deny_all.py --advisories baseline

  # The Logos Core modules' crates, staged as the module builder sees them, resolve with their committed Cargo.lock
  # files (scripts/ci/modules-resolve.sh): a manifest change in a crate a module vendors (cli/, lez/wire, ...) that
  # the module does not follow fails here. ferrata_updater_module is left out (its staging needs lez/'s guests).
  # Then cli/'s library is compiled without lez-wallet, as ferrata_relayer_module uses it: code that needs the wallet's
  # crates outside #[cfg(feature = "lez-wallet")] fails here, where the default-feature builds pass.
  modules-resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2b28c52cef68d77e9a4de0b428559db37728c04f # 1.93.0
      - name: Rust 1.98.1 (LEZ v0.4.0-rc1's toolchain; ferrata_relayer_module, as modules/scripts/native.sh)
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache the upstream sources (LEZ v0.4.0-rc1 1806e87, Logos Blockchain d480efc6)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/../upstream
          key: upstream-lez-1806e87-e3edf47-logos-blockchain-d480efc6
      - name: Fetch the upstream sources
        run: scripts/fetch-upstream.sh
      - name: Every module's staged crate resolves with its committed Cargo.lock
        run: scripts/ci/modules-resolve.sh
      # RFP-021 R.5: ferrata_attest_module's own Ethereum reads (fetch_log_proof, and eth_getProof behind build_attest_tx
      # and dry_run_attest) against a scripted endpoint on 127.0.0.1 that refuses, holds, cuts or errors: each an error
      # within its bound, each answered once the endpoint is back. Uses the crates the step above staged. Local only.
      - name: The attestation module's Ethereum reads against a failing endpoint (RFP-021 R.5)
        working-directory: modules/ferrata_attest_module/rust-lib
        run: cargo test --locked -p ferrata-attest-calls --test failing_endpoint -- --nocapture
      - name: System libraries (libpcsclite for LEZ's wallet crates, protoc)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpcsclite-dev protobuf-compiler
      - name: cli/'s library compiles as ferrata_relayer_module builds it (without lez-wallet)
        run: cd cli && cargo +1.98.1 check --locked --no-default-features --lib
      # All bridge-calls targets on loopback: the unit suites; RFP-022 U.9 endpoint switching through each connection
      # owner, put back after a failed reading; and the terminal network session (RFP-022 U.6): balances and faucet,
      # plaintext claim/public burn approve-then-confirm, and release hand-off. No public network. The live endpoint
      # run inside Logos Core remains e2e/endpoints/run.sh (build box).
      - name: The bridge module's calls, endpoint switching and terminal network session (RFP-022 U.6, U.9)
        working-directory: modules/ferrata_bridge_module/rust-lib
        run: cargo test --locked -p ferrata-bridge-calls -- --nocapture

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the build page pins each repository link to the commit that last changed its file
      - name: Every relative link in README.md, docs/ and the READMEs elsewhere resolves to a tracked file
        run: python3 -I scripts/check-links.py README.md docs cli/README.md monitor/README.md lez/ATTEST-CLI.md lez/updater/README.md e2e/seqnet/README.md
      # RFP-021 S.3-S.6, VS.5; RFP-022 U.7, R.12-R.14, Sec.7: the guides kept in step with the code (every
      # attestation code with its client action, the tool's privacy table word for word, every bridge code
      # named, no guide called a first draft, keyless retirement as FerrataVault.sol counts it).
      - name: The guides agree with the code (scripts/check-guides.py)
        run: python3 -I scripts/check-guides.py
      - name: The guide checker's own tests (scripts/test_check_guides.py)
        run: python3 -I scripts/test_check_guides.py
      # RFP-021 S.11 / RFP-022 S.4: every decision record's form, and every path, quote and name it cites.
      - name: The decision log's form and references (scripts/check-decisions.py)
        run: python3 -I scripts/check-decisions.py
      - name: The decision checker's own tests (scripts/test_check_decisions.py)
        run: python3 -I scripts/test_check_decisions.py
      # The release's supply chain and the image-id tooling (standard library; bash, git, tar, gzip).
      - name: The image-id tooling's tests (scripts/reproduce/test_image_id_tools.py)
        run: python3 -I scripts/reproduce/test_image_id_tools.py
      - name: The native archives' fetch and build check (scripts/test_fetch_native.py)
        run: python3 -I scripts/test_fetch_native.py
      - name: The release manifest and crate notices (scripts/test_release_manifest.py)
        run: python3 -I scripts/test_release_manifest.py
      - name: The release scripts end to end, with stubs (scripts/test_release_scripts.py)
        run: python3 -I scripts/test_release_scripts.py
      - name: The vault's pinned libraries (scripts/test_vault_libs.py)
        run: python3 -I scripts/test_vault_libs.py
      - name: The cargo-deny runner (scripts/test_deny_all.py)
        run: python3 -I scripts/test_deny_all.py
      # RFP-022 R.10, S.1: the live round trip's committed record re-derived offline (its LEZ bytes decoded and
      # hashed, the claim's opening, the burn leaf and the release journal linked); online: --check (README there).
      # RFP-022 R.6: the checkpoint and release prover's client killed mid-proof and started again (it waits for the same
      # call), the prover dying mid-proof (proven again), its service down (the request kept), a restart after delivery
      # (no second job), a proof of another journal (failed at once); a stand-in for Modal's call model.
      - name: The prover client under faults (deploy/testnet/tests/test_prover_client.py)
        run: python3 -I deploy/testnet/tests/test_prover_client.py
      - name: The live round trip's record, offline (scripts/test_verify_live_roundtrip.py)
        run: python3 -I scripts/test_verify_live_roundtrip.py
      - name: The Sepolia fixture's Transfer selection, offline (lez/scripts/test_fetch_attest_fixture.py)
        run: python3 -I lez/scripts/test_fetch_attest_fixture.py
      # RFP-022 P.5, P.6: the documented performance figures recomputed from the committed records (the live
      # run's stamps, captures and driver log; the daemons' GNU time, samples and RPC byte counts; the provers'
      # run.json files, prove.jsonl and groth16.jsonl) and asserted stated by the documents that document them.
      - name: The documented performance figures recomputed from the committed records (scripts/test_perf_records.py)
        run: python3 -I scripts/test_perf_records.py
      # RFP-021 P.2: the proof records summarized into lez/results/perf-proofs.md, byte for byte, and a misfiled log,
      # a proof on a sibling image, a guest missing from a stage's sums and another program's private run refused.
      - name: The P.2 proof records and their image-id checks (bench/perf/test_summarize_proofs.py)
        run: python3 -I bench/perf/test_summarize_proofs.py
      # RFP-021 U.3, P.6: the record of the modules on the LEZ v0.4.0-rc3 network we run, its figures and checks computed
      # again from its files, offline (modules/results/live-testnet-2026-11-23/).
      - name: The live test-network record's figures and checks recomputed (modules/scripts/test_live_testnet.py)
        run: python3 -I modules/scripts/test_live_testnet.py
      # RFP-022 P.6: the rule (B) attestor's CPU, memory and bytes read per round, summarized from a zone run's records
      # (checkpoint/attestor/resources.py; zone-bridge.sh times every round).
      - name: The attestor's resources from a run's records (checkpoint/attestor/test_resources.py)
        run: python3 -I checkpoint/attestor/test_resources.py
      # RFP-021 S.8, RFP-022 Sec.1 (no audit yet): the audit scope's inventory is generated from this tree, and the
      # document carries exactly the generated tables (scripts/audit_scope.py).
      - name: The audit scope's source inventory (scripts/test_audit_scope.py)
        run: python3 -I scripts/test_audit_scope.py
      # RFP-022 U.5, Priv.7: the test network's gateway publishing its gas-drop relayer: the terms (404 only when none
      # are published), the inbox's checks, a job's receipt verified before it counts against any cap, no address or
      # nullifier in its log (deploy/testnet/host/bin/ferrata-gateway, standard library only).
      - name: The gateway's gas-drop routes (deploy/testnet/tests/test_gateway_gasdrop.py)
        run: python3 -I deploy/testnet/tests/test_gateway_gasdrop.py
      # RFP-022 F.7 on the test network (deploy/testnet/MULTIKEY.md): the zone's configurations for 1 + N sequencers on one
      # host, and the checkpoint builder taking t(n) attestations of one tip from the host's attestors (one key: as before).
      - name: The test network's further sequencer keys and t-of-n checkpoints (deploy/testnet/tests/test_zone_keys.py, test_checkpoint_attestors.py)
        run: python3 -I deploy/testnet/tests/test_zone_keys.py && python3 -I deploy/testnet/tests/test_checkpoint_attestors.py
      # The build page (site/README.md): a fresh build's counts equal the status document's and every link it emits
      # resolves; the committed bundle's freshness is left to its rebuild (--skip-freshness).
      - name: The build page, built fresh and checked (site/test_site.py --skip-freshness)
        run: python3 -I site/test_site.py --skip-freshness
      # RFP-022 Reliability #11: every hard row of both RFPs mapped to its tests, records and documents
      # (scripts/ci/row-tests.toml), and every test said to run in a CI job really run by that job's
      # commands (scripts/ci/ci_model.py reads the workflows and the scripts they call). The checker's own
      # tests, and the YAML reader against yq where the runner has it. RFP-021 S.8 / RFP-022 Sec.1: the
      # audit promise. RFP-022 S.2: the shell macos.yml runs has no GNU-only command and nothing newer
      # than bash 3.2.
      - name: The row-to-test map is consistent, and CI runs every test it says CI runs
        run: python3 -I scripts/ci/check-row-tests.py
      - name: The checks' own tests (scripts/ci/test_ci_model.py)
        run: python3 -I scripts/ci/test_ci_model.py
      - name: Every LEZ harness and updater test binary is covered by exactly one shard (scripts/ci/check-lez-shards.py)
        run: python3 -I scripts/ci/check-lez-shards.py
      - name: The LEZ shard guard's own tests (scripts/ci/test_lez_shards.py)
        run: python3 -I scripts/ci/test_lez_shards.py
      - name: The workflows read as yq reads them
        run: if command -v yq > /dev/null; then python3 -I scripts/ci/ci_model.py --compare-yq; else echo "yq not on this runner; skipped"; fi
      - name: The shell that runs on macOS is portable (scripts/ci/check-portable.py)
        run: python3 -I scripts/ci/check-portable.py
      - name: The sequencer job's record checks and path scrubbing (scripts/ci/test-sequencer-records.sh)
        run: bash scripts/ci/test-sequencer-records.sh "$RUNNER_TEMP/test-sequencer-records"
      - name: The code is marked unaudited / not for production until the audit reports are published
        run: bash scripts/ci/check-unaudited.sh
      # scripts/ci/check-actions-pinned.py joins this job once the owner has pinned the actions by commit
      # (python3 scripts/ci/pin-actions.py --write, which reads the network; modules/catalog/RELEASE.md).

  # The catalog's owner steps (modules/catalog/RELEASE.md), end to end with no network: a stub gh,
  # GitHub as local bare repositories, every transport but file:// refused; the refusals before anything is
  # created, the order of the steps, a rerun, a failure and its resumption, a dry run, no TMPDIR, and
  # export.sh's reproducible commits; and --update, a published catalog changed by fast-forwards only (its
  # refusals, a rerun that changes nothing, the dry run's commits equal to --yes's) (RFP-021 S.9, S.10;
  # RFP-022 U.10, S.3).
  release-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The publish step, with a stub gh and no network
        run: bash modules/scripts/test-release-publish.sh "$RUNNER_TEMP/test-release-publish"

  # The image ids the tools resolve (scripts/test_image_ids.py): standard-library Python, offline. The live runs'
  # records are held to the bridge program they deployed, a run of the program since milestone B1 to its own row.
  image-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: docs/image-ids.md names each program once; verify-sepolia and compare_ids resolve the right row
        run: python3 -I scripts/test_image_ids.py

  # The IDL of the attestation and bridge programs (idl/README.md): standard-library Python, no
  # toolchain. The vectors it decodes are written by lez/bridge-wire/tests/idl_vectors.rs, which
  # runs with lez/ (by hand) and fails when the wire and the committed vectors part.
  idl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The IDL alone decodes every committed borsh vector of both programs
        run: python3 -I idl/check.py

  # The admin view's own code (admin/README.md), offline: keccak, SHA-256, the ABI codec and the
  # vault's selectors, topics and hash vectors, run from admin/index.html's inline script.
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The admin view's self-test
        run: node admin/dump.mjs --selftest

  # scripts/verify.py, the reviewer's re-check tool (docs/VERIFY.md): every offline check of its quick tier (numbers
  # re-derived from the committed records, hashes and image ids, Groth16 seals verified locally, signatures, the
  # documents' own checks, the tools' tests), then the tamper tests: each check family run on a copy of the
  # repository with one piece of evidence altered (a seal's byte, a transaction hash, a recorded number, a manifest
  # hash, a signature) must fail. The named tests of the requirement map are the other jobs' (verify.py --tests).
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # site-manifest-git reads the blobs of the commit the site's manifest names
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.3.6 # anvil and cast, for the send guards' and the deploy tool's tests
      - name: Cache the vault's libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vault/lib
          key: vault-lib-forge-std-1.10.0-oz-5.4.0-risc0-ethereum-3.1.0
      - name: The vault built at its pinned libraries (unit-deploy-sepolia deploys it on anvil; without it, it runs no test)
        run: |
          (cd vault && { [ -d lib/risc0-ethereum ] || forge install --no-git foundry-rs/forge-std@v1.10.0 OpenZeppelin/openzeppelin-contracts@v5.4.0 risc0/risc0-ethereum@v3.1.0; })
          python3 -I scripts/vault_libs.py check
          (cd vault && forge build)
      - name: Every offline check of the quick tier
        run: python3 -I scripts/verify.py --all --offline --strict
      - name: The tamper tests of every check family
        run: python3 -I scripts/test_verify.py && python3 -I scripts/test_verify_lc.py && python3 -I scripts/test_verify_f13.py
      - name: The checks and their tests left the tree as they found it
        if: always()
        run: |
          git status --porcelain --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"
