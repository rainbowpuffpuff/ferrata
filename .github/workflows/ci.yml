name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: riscv32im-unknown-none-elf
      - uses: actions/cache@v4
        with:
          path: vectors
          key: vectors-consensus-specs-v1.7.0-beta.4-bls12-381-tests-v0.1.2
      - name: Fetch pinned spec vectors
        run: scripts/fetch-vectors.sh
      - name: Spec vectors, adversarial suite, nullifier demo
        run: cargo test --workspace --locked -- --nocapture
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: no_std build for the RISC Zero guest ISA
        run: cargo build -p ferrata-core --no-default-features --features zkcrypto --target riscv32im-unknown-none-elf --release --locked
