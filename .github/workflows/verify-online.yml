# scripts/verify.py's online checks (docs/VERIFY.md §2), daily and by hand: read-only requests to public endpoints
# (Sepolia, Ethereum mainnet, our public LEZ test network, the live site, Sepolia beacon APIs); nothing is signed or
# sent and no secret is used. A failure here means a public fact no longer matches its committed record (or an
# endpoint stopped answering: a check that cannot read its endpoint skips and says so).
name: verify-online

on:
  schedule:
    - cron: '29 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  online:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # site-manifest-online hashes the git blobs the site's manifest names
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.3.6 # cast, for the two deployment read-backs
      - name: Every online check (read-only)
        run: python3 -I scripts/verify.py --all --online
