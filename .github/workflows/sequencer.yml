name: sequencer

# Manual only for now (21 November 2026): on the build box this job built LEZ's standalone sequencer from source,
# deployed the programs through its loader (20 transactions applied), and stopped in `scenarios`, whose recorded
# mainnet checkpoint (period 1899, about 31 October 2026) is older than the instance's validity window while the
# standalone sequencer stamps blocks with the wall clock (e2e/runs/ci-sequencer-attest-2026-11-21/README.md). It joins
# push and pull_request once its phases run on fresh data (a committee whose keys the run holds, as the driver's
# `inbound --chain stand-in` phase makes).
on:
  workflow_dispatch:

# The end-to-end run against a real, running LEZ sequencer (RFP-021 Supportability #2: "... against a LEZ
# sequencer (standalone mode) ... and are included in CI."). The `roundtrip` job of ci.yml runs LEZ's state
# transition in process; this job runs LEZ's own sequencer_service, built from the unmodified tag as
# lez/live/README.md builds it. RFP-022 Reliability #10's bridge round trip against the standalone
# sequencer has no job here yet (docs/rows/G.md, R.10). Its actions are tag-pinned like the new ones of
# macos.yml, each with the TODO marker scripts/ci/check-actions-pinned.py reads.

jobs:
  # RFP-021 Supportability #2: attestation production and consumption against LEZ's sequencer built with
  # its `standalone` feature (its mock Bedrock actor; no Logos Blockchain node): the programs deployed
  # through the loader, an instance, updates that advance it, the refusals, and the reference consumer
  # consuming the attestation in one transaction (scripts/ci/sequencer-attest.sh). Estimated, not
  # measured: 1.5-2 h on a 4-core runner (the build took 16 min on the 16-core build box; the consumer's
  # one real proof took 280 s at 32 threads there and grows with fewer cores).
  sequencer-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      # No debug info, no incremental artefacts, as the `roundtrip` job (ci.yml): the caches must stay
      # far below the 10 GB GitHub keeps per repository.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4 # TODO: pin to a commit SHA
      - name: Free disk space (the LEZ and Logos Blockchain builds need about 20 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h .
      - name: System libraries (libpcsclite for LEZ's wallet crates, protoc)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpcsclite-dev protobuf-compiler
      - uses: dtolnay/rust-toolchain@1.93.0 # TODO: pin to a commit SHA
      - name: Rust 1.98.1 (LEZ v0.4.0-rc1's toolchain; lez/ builds with it)
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache RISC Zero's toolchains
        uses: actions/cache@v4 # TODO: pin to a commit SHA
        with:
          path: |
            ~/.risc0
            ~/risc0-home-lez
          key: risc0-3.1.0-3.0.5-rust-1.88.0-1.91.1-cpp-2024.1.5-${{ hashFiles('scripts/ci/install-risc0.sh') }}
      - name: RISC Zero toolchains (rzup)
        run: scripts/ci/install-risc0.sh
      - name: Cache the upstream sources (LEZ v0.4.0-rc1 1806e87, Logos Blockchain d480efc6)
        uses: actions/cache@v4 # TODO: pin to a commit SHA
        with:
          path: ${{ github.workspace }}/../upstream
          key: upstream-lez-1806e87-e3edf47-logos-blockchain-d480efc6
      - name: Fetch the upstream sources
        run: scripts/fetch-upstream.sh
      # The LEZ build: the driver's and the sequencer's crates (the guests, the methods crate and
      # everything under lez/) go into lez/target; the sequencer and the driver themselves build into
      # scratch beside the repository, which the GitHub runners do not keep.
      - uses: Swatinem/rust-cache@v2 # TODO: pin to a commit SHA
        with:
          workspaces: lez -> target
          shared-key: sequencer-attest
          cache-on-failure: true
      - name: Attestation against a running LEZ sequencer (standalone)
        run: scripts/ci/sequencer-attest.sh e2e/runs/ci-sequencer-attest
      - name: Records
        if: always()
        uses: actions/upload-artifact@v4 # TODO: pin to a commit SHA
        with:
          name: ci-sequencer-attest-records
          path: e2e/runs/ci-sequencer-attest
