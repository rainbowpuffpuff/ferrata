name: lez-full

# Daily (04:17 UTC) and manual backstop running scripts/ci/lez-harness.sh unsharded once, covering every target of
# lez/harness and lez/updater and the privacy suite in one job. Kept in its own workflow file so .github/workflows/ci.yml
# has no skipped job on push, pull_request or workflow_dispatch (RFP-021 R.12 / A4 gate: CI passes on main with none
# skipped). GitHub runs `schedule` on the default branch only and disables scheduled workflows automatically after 60
# days without repository activity in a public repository. scripts/ci/check-row-tests.py counts this workflow as manual
# (not push/PR CI), the same as sequencer.yml.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# A read-only token: this job does not write to the repository or call GitHub's API. Third-party actions are pinned by
# commit (same SHAs as .github/workflows/ci.yml).
permissions:
  contents: read

# vault/foundry.toml keeps forge offline, so a build never fetches anything by itself; a fresh runner has no
# solc 0.8.26 yet, so here forge may fetch that one compiler (the version is pinned in foundry.toml).
env:
  FOUNDRY_OFFLINE: "false"

jobs:
  # Unsharded backstop for the LEZ suites (scripts/ci/lez-harness.sh): builds and runs every non-feature-gated target
  # of lez/harness and lez/updater (lib, bins, integration tests, doc-tests) in RISC Zero dev mode, plus the privacy
  # suite and its gate. Measured unsharded duration on GitHub Actions: 50.6-74.6 min (runs 45075900693 and 45072883393).
  lez-harness-full:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h .
      - uses: dtolnay/rust-toolchain@2b28c52cef68d77e9a4de0b428559db37728c04f # 1.93.0
      - name: Rust 1.98.1 (LEZ v0.4.0-rc1's toolchain, lez/rust-toolchain.toml)
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Cache RISC Zero's toolchains
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.risc0
            ~/risc0-home-lez
          key: risc0-3.1.0-3.0.5-rust-1.88.0-1.91.1-cpp-2024.1.5-${{ hashFiles('scripts/ci/install-risc0.sh') }}
      - name: RISC Zero toolchains (rzup)
        env:
          GITHUB_TOKEN: ${{ github.token }} # rzup's GitHub API calls: the job's read-only token, not the 60-an-hour limit
        run: scripts/ci/install-risc0.sh
      - name: Cache the upstream sources (LEZ v0.4.0-rc1 1806e87, Logos Blockchain d480efc6)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/../upstream
          key: upstream-lez-1806e87-e3edf47-logos-blockchain-d480efc6
      - name: Fetch the upstream sources
        run: scripts/fetch-upstream.sh
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.3.6
      - name: Cache the vault's libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: vault/lib
          key: vault-lib-forge-std-1.10.0-oz-5.4.0-risc0-ethereum-3.1.0
      - name: Libraries (the privacy suite's Ethereum half)
        working-directory: vault
        run: '[ -d lib/risc0-ethereum ] || forge install --no-git foundry-rs/forge-std@v1.10.0 OpenZeppelin/openzeppelin-contracts@v5.4.0 risc0/risc0-ethereum@v3.1.0'
      - name: Build (the harness's and the updater's tests, the guests)
        timeout-minutes: 45
        run: scripts/ci/lez-harness.sh build
      - name: The harness and updater suites, dev mode
        timeout-minutes: 150
        run: scripts/ci/lez-harness.sh
