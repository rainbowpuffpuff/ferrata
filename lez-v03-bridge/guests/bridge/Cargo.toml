[package]
name = "ferrata_bridge03"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# A guest is its own workspace, so its [patch.crates-io] applies to the core crates and lee_core too.
[workspace]

[dependencies]
ferrata-lez03-bridge-core = { path = "../../core" }
lee_core = { path = "../../../../upstream/lez-v0.3.1/lee/state_machine/core" }
# LEZ v0.3.1 pins risc0-zkvm 3.0.5.
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
borsh = { version = "1.5.7", features = ["derive"] }
# Pin the versions the patches provide, so the resolver selects them.
sha2 = "=0.10.8"
tiny-keccak = "=2.0.2"

[patch.crates-io]
# RISC Zero's accelerated SHA-256 (zkVM 3.0 precompile table): the claim's path, the leaves, the guards.
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
# RISC Zero's accelerated Keccak, for the Merkle-Patricia proofs of `Init` and `ImportRoot`, which run in
# public transactions only (the sequencer executes them, nobody proves them), as in lez/guests/program.
# The proven paths (`ClaimPrivately`, a private `Burn`) hash with SHA-256 only.
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
