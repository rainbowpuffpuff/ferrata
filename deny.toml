# cargo-deny policy for Ferrata's Rust workspaces (scripts/security-tools.sh deny; triage in
# notes/reviews/security/tools-2026-11-11.md). Checks: advisories, licenses, sources.

[graph]
all-features = true

[advisories]
version = 2
# Every RustSec advisory (vulnerability, unmaintained, unsound, notice) is reported; nothing is ignored
# here: the triage note lists each one and why it is or is not reachable.
yanked = "warn"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licences compatible with the workspace's MIT OR Apache-2.0.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
