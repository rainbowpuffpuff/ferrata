[package]
name = "host"
version = "0.1.0"
description = "Runs, proves and Groth16-wraps the release guest; writes artifacts/ and the Foundry fixtures"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ferrata-bridge-core = { path = "../crates/ferrata-bridge-core" }
methods = { path = "../methods" }
# Client only: execution and proving run in r0vm 3.0.5 (installed with rzup), over IPC.
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["client"] }
anyhow = "1"
bincode = "1.3"
hex = "0.4"
serde_json = "1"
