[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
cache_path = "cache"

# Same compiler and settings as ../../vault (the vault's own project), so gas matches what the
# vault was built with: solc 0.8.26, already present locally, optimizer 200 runs, cancun, no IR.
solc_version = "0.8.26"
auto_detect_solc = false
offline = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
auto_detect_remappings = false

remappings = [
    "forge-std/=lib/forge-std/src/",
    # RISC Zero's contracts (RiscZeroGroth16Verifier, ControlID) at the pinned tag, and the
    # OpenZeppelin copy that tag pins for them.
    "risc0/=lib/risc0-ethereum/contracts/src/",
    "openzeppelin/=lib/risc0-ethereum/lib/openzeppelin-contracts/",
    # FerrataVault v2: a read-only export of the vault's v2, commit 1d61b32 (vendor/vault-v2/PROVENANCE.txt), so
    # these tests stay pinned while that repository moves on. Its OpenZeppelin imports resolve to the copy
    # the vault project builds with (5.4.0; the 5.2.0 inside risc0-ethereum lacks SafeERC20.trySafeTransfer).
    "ferrata-vault/=vendor/vault-v2/",
    "@openzeppelin/contracts/=../../vault/lib/openzeppelin-contracts/contracts/",
]
allow_paths = ["../../vault"]
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read", path = "../vectors" }, { access = "read", path = "./out" }]
