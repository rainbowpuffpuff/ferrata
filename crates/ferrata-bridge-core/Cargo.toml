[package]
name = "ferrata-bridge-core"
version = "0.2.0"
description = "Ferrata bridge, spec v2: deposit and burn trees, commitments, nullifiers, claim, release and checkpoint encodings (prototype, unaudited)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["std"]
# std adds: the full (non-incremental) tree with Merkle path creation, and the wallet-side
# recovery scans. Everything a verifier or a zkVM guest needs is no_std.
std = []

[dependencies]
sha2 = { version = "0.10.8", default-features = false }
hmac = { version = "0.12.1", default-features = false }

[dev-dependencies]
hex = "0.4"
proptest = "1.6"
serde_json = "1"
