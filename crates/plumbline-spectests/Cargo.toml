[package]
name = "plumbline-spectests"
description = "Runs the official consensus-spec-tests light-client vectors against plumbline-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
plumbline-core = { path = "../plumbline-core", features = ["blst", "zkcrypto"] }
snap = "1"
serde_yaml = "0.9"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
blst = "0.3"
