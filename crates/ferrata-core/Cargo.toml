[package]
name = "ferrata-core"
description = "Ethereum sync-committee light-client verification core (Ferrata, Logos RFP-021 spike)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["blst"]
# Native BLS backend (supranational/blst, the library RISC Zero accelerates).
blst = ["dep:blst"]
# Pure-Rust BLS backend (zkcrypto/bls12_381), used as a differential oracle.
zkcrypto = ["dep:bls12_381", "dep:sha2_09", "dep:group"]

[dependencies]
sha2 = { version = "0.10", default-features = false }
blst = { version = "0.3", optional = true }
bls12_381 = { version = "0.8", optional = true, default-features = false, features = ["groups", "pairings", "alloc", "experimental"] }
sha2_09 = { package = "sha2", version = "0.9", optional = true, default-features = false }
group = { version = "0.13", optional = true, default-features = false }
# Keccak-256 for the execution layer, behind `keccak::keccak256` (RISC Zero ships an accelerated
# fork of this crate that a guest can patch in).
tiny-keccak = { version = "2.0.2", default-features = false, features = ["keccak"] }
