[package]
name = "ferrata-spectests"
description = "Runs the official consensus-spec-tests light-client vectors against ferrata-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
ferrata-core = { path = "../ferrata-core", features = ["blst", "zkcrypto"] }
snap = "1"
serde_yaml = "0.9"
hex = "0.4"
sha2 = "0.10"
blst = "0.3"


[dev-dependencies]
bls12_381 = { version = "0.8", default-features = false, features = ["groups", "alloc"] }
