[package]
name = "ferrata-bridge-calls"
description = "The methods of ferrata_bridge_module as functions over JSON, without the module scaffold"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# The crates below are staged copies (scripts/stage.py: the repository's under ../staged/, LEZ's
# under ../upstream/), laid out as in the repository so that their own path dependencies hold.
[dependencies]
# The bridge core, with `std`: full trees with paths, and the recovery scans.
ferrata-bridge-core = { path = "../staged/bridge/crates/ferrata-bridge-core", features = ["std"] }
# The bridge program's messages, states, addresses and checks; the attestation program's records.
ferrata-lez-bridge-wire = { path = "../staged/lez/bridge-wire" }
ferrata-lez-wire = { path = "../staged/lez/wire" }
# The `ferrata` tool's wallet rules and calls (cli/wallet), with the release guest run through r0vm.
ferrata-wallet = { path = "../staged/cli/wallet", features = ["prove"] }
borsh = { version = "=1.6.1", features = ["derive"] }
serde_json = "1"
# The vault's function selectors (Keccak-256 of the signature), as ferrata-core computes Keccak.
tiny-keccak = { version = "2", features = ["keccak"] }
# The network session (net.rs, lezkey.rs): HTTPS to a test network's gateway and to an Ethereum endpoint (rustls with
# ring, Mozilla's roots from webpki-roots; no redirects), the recovery phrase (BIP-39), LEZ's public keys and BIP-340
# signatures (k256), its private account ids (ML-KEM-768, as LEZ's key_protocol), secrets zeroized when dropped (bip39's
# mnemonic too).
ureq = { version = "3", default-features = false, features = ["rustls"] }
bip39 = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
k256 = { version = "0.13", default-features = false, features = ["std", "arithmetic", "schnorr"] }
hmac = "0.12"
sha2 = "0.10"
ml-kem = "0.3"
zeroize = "1"
getrandom = "0.2"
bs58 = "0.5"
base64 = "0.22"
# The sealed channel with the mini-app's view (seal.rs): X25519 (its secrets zeroized on drop), and the module's
# process made non-dumpable while it holds keys (libc's prctl).
x25519-dalek = { version = "2", features = ["static_secrets"] }
libc = "0.2"
