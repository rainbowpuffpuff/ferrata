[package]
name = "ferrata-monitor-calls"
description = "The methods of ferrata_monitor_module as functions over JSON, without the module scaffold"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The staged copy of monitor/ (scripts/stage.sh): the same arguments, daemon and checks as the binary.
ferrata-monitor = { path = "../monitor" }
tokio = { version = "1.50", features = ["rt-multi-thread", "time", "sync"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
serde_json = "1"
