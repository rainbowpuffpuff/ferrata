[package]
name = "ferrata_attestor_module"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# A workspace of its own, so that cargo adopts no parent workspace. Its `package` fields are the
# ones the staged copy of checkpoint/attestor inherits; they equal checkpoint/Cargo.toml's (stage.sh checks).
# The staged crates keep checkpoint/'s layout (attestor/, crates/), so their path dependencies resolve
# unchanged.
[workspace]
members = ["calls"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["staticlib"]

# Cargo.lock is committed: the builder feeds it to buildRustPackage. It was seeded from
# checkpoint/Cargo.lock (the versions the attestor is tested with) on the build box.
[dependencies]
serde_json = "1"
# Staged by the builder from the logos-rust-sdk revision its code generator comes from.
logos-rust-sdk = { path = "../logos-rust-sdk-src" }
ferrata-attestor-calls = { path = "calls" }
