[package]
name = "ferrata-attestor-calls"
description = "The methods of ferrata_attestor_module as functions over JSON, without the module scaffold"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The staged copies (scripts/stage.sh): the attestor's library (its program is checkpoint/attestor),
# and the checkpoint core it checks blocks and runs the rule with.
ferrata-attestor = { path = "../attestor" }
checkpoint-core = { path = "../crates/checkpoint-core", features = ["std"] }
attestor-core = { path = "../crates/attestor-core" }
ed25519-dalek = { version = "2.2.0", default-features = false }
anyhow = "1"
hex = "0.4"
serde_json = "1"
