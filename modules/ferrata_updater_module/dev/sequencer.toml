# The same as recorded.toml with the sequencer backend (`[sequencer]` below, as lez/updater's example): the module
# carries it (lez/updater/sequencer's library, which links LEZ's node-side crates) and connects to the sequencer's RPC
# on this machine; with none there, the set-up fails on the connection, as the binary's does. A running sequencer and
# the program's account: lez/crown/session.sh u in module mode writes such a file for a crown zone.
[daemon]
name = "module"
state_dir = "../../out/updater-state"
poll_secs = 0
ledger = "sequencer"

[keys]
payer_key_file = "../../../lez/updater/dev/payer.key"

[fees]
gas_limit = 4800000
max_fee_per_tx = 1000000000
budget = 1000000000000

[policy]
defer_window = 1
max_lag_slots = 64
min_agreeing = 2
retry_base_ms = 500
retry_max_ms = 30000
max_attempts = 5
demote_rounds = 50
max_periods_per_request = 16

[[chain]]
name = "mainnet"
preset = "mainnet"
checkpoint = "4baa732e5dbdbe97932abcf62c7caccc1cba8e9c14118d153aea629e25a4abff"
adoption_parts = 2

  [[chain.source]]
  name = "record-a"
  dir = "../../../lez/lab/results/record/net/mainnet"

  [[chain.source]]
  name = "record-b"
  dir = "../../../lez/lab/results/record/net/mainnet"

[[chain]]
name = "sepolia"
preset = "sepolia"
checkpoint = "5f71d7f650f9252b48749b5f062c0c234e01afd69f364ab600e2b6051494b20d"
adoption_parts = 2

  [[chain.source]]
  name = "record-a"
  dir = "../../../lez/lab/results/record/net/sepolia"

  [[chain.source]]
  name = "record-b"
  dir = "../../../lez/lab/results/record/net/sepolia"

[sequencer]
rpc = "http://127.0.0.1:3040"
program = "A5E62aMHKFUPwtuMZRUTSPsGwkpzeGBWmbVzD8F5tKcX"
