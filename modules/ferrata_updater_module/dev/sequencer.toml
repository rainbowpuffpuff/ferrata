# The same as recorded.toml with the sequencer backend, which is not built: the module refuses it, as the binary does.
[daemon]
name = "module"
state_dir = "../../out/updater-state"
poll_secs = 0
ledger = "sequencer"

[keys]
payer_key_file = "../../../lez/updater/dev/payer.key"

[fees]
gas_limit = 4800000
max_fee_per_tx = 1000000000
budget = 1000000000000

[policy]
defer_window = 1
max_lag_slots = 64
min_agreeing = 2
retry_base_ms = 500
retry_max_ms = 30000
max_attempts = 5
demote_rounds = 50
max_periods_per_request = 16

[[chain]]
name = "mainnet"
preset = "mainnet"
checkpoint = "4baa732e5dbdbe97932abcf62c7caccc1cba8e9c14118d153aea629e25a4abff"
adoption_parts = 2

  [[chain.source]]
  name = "record-a"
  dir = "../../../lez/lab/results/record/net/mainnet"

  [[chain.source]]
  name = "record-b"
  dir = "../../../lez/lab/results/record/net/mainnet"

