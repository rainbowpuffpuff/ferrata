[package]
name = "ferrata-relayer-calls"
description = "The methods of ferrata_relayer_module as functions over JSON, without the module scaffold"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The staged copy of cli/ (scripts/stage-relayer.sh): the relayer daemon's own code (ferrata_cli::relayerd),
# without the `lez-wallet` feature (LEZ's wallet library links LEZ's node-side crates: RocksDB, libp2p).
ferrata-cli = { path = "../vendor/ferrata/cli", default-features = false }
tokio = { version = "1.50", features = ["rt-multi-thread", "time", "sync"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
serde_json = "1"
