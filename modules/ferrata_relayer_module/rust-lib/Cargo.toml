[package]
name = "ferrata_relayer_module"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# A workspace of its own, so that cargo adopts no parent workspace. The staged sources under vendor/
# (scripts/stage-relayer.sh) keep the repository's and LEZ's layouts and their own workspaces.
[workspace]
members = ["calls"]
exclude = ["vendor"]

[lib]
crate-type = ["staticlib"]

# Cargo.lock is committed: the builder feeds it to buildRustPackage. It was seeded from cli/Cargo.lock
# (the versions the relayer is tested with) on the build box.
[dependencies]
serde_json = "1"
# Staged by the builder from the logos-rust-sdk revision its code generator comes from.
logos-rust-sdk = { path = "../logos-rust-sdk-src" }
ferrata-relayer-calls = { path = "calls" }
