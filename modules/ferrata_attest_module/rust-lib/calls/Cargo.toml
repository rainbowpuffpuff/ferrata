[package]
name = "ferrata-attest-calls"
description = "The methods of ferrata_attest_module as functions over JSON, without the module scaffold"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The staged copy (scripts/stage.sh). No BLS backend: no method here verifies a signature.
ferrata-core = { path = "../ferrata-core", default-features = false }
serde_json = "1"
sha2 = "0.10"
