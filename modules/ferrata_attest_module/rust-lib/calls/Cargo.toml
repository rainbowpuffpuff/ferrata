[package]
name = "ferrata-attest-calls"
description = "The methods of ferrata_attest_module as functions over JSON, without the module scaffold"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The staged copy (scripts/stage.sh). No BLS backend: no method here verifies a signature.
# The crates below are staged copies (scripts/stage.py: the repository's under ../staged/, LEZ's
# under ../upstream/), laid out as in the repository so that their own path dependencies hold.
# The verification core; blst for `advance`, which runs the program's job steps natively.
ferrata-core = { path = "../staged/crates/ferrata-core", features = ["blst"] }
# The attestation program's messages and states, and the updater's job planning (lez/advance).
ferrata-lez-wire = { path = "../staged/lez/wire" }
ferrata-advance = { path = "../staged/lez/advance" }
lee_core = { path = "../upstream/lez-v0.4.0-rc1/lee/state_machine/core" }
borsh = { version = "=1.6.1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
