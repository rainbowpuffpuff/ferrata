[package]
name = "keccak_plain"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

# A guest is its own workspace, so its [patch.crates-io] applies to ferrata-core too.
[workspace]

[dependencies]
exec-core = { path = "../exec-core" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
sha2 = "=0.10.8"
tiny-keccak = "=2.0.2"

[patch.crates-io]
# The same accelerated SHA-256 as keccak-accel; Keccak stays plain (crates.io tiny-keccak 2.0.2).
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
