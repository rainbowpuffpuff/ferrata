[package]
name = "blst_accel"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

# A guest is its own workspace, so its [patch.crates-io] applies to ferrata-core too.
[workspace]

[dependencies]
bench-core = { path = "../bench-core", features = ["blst"] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
# Pin the versions the patches provide, so the resolver selects them.
sha2 = "=0.10.8"
blst = "=0.3.16"

[patch.crates-io]
# RISC Zero's accelerated blst. Newest tag; its dev-dependencies were moved to risc0-zkvm 3.0.
blst = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }
# RISC Zero's accelerated SHA-256 (zkVM 3.0 precompile table).
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
