# Experimental, unaudited bench guest: one whole light-client update in one execution (as
# guests/residue-accel), with the signing key composed by the core or by ../../residue-agg (one
# multiproof for all non-signers, batch addition); and the profile of a non-signer's cost. No
# deployed program uses it; it has no entry in docs/image-ids.md.
[package]
name = "residue_agg_accel"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

# A guest is its own workspace, so its [patch.crates-io] applies to ferrata-core too.
[workspace]

[dependencies]
ferrata-core = { path = "../../../crates/ferrata-core", default-features = false, features = ["blst"] }
residue = { path = "../../residue" }
residue-agg = { path = "../../residue-agg" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
# Pin the versions the patches provide, so the resolver selects them (as guests/blst-accel).
sha2 = "=0.10.8"
blst = "=0.3.16"

[patch.crates-io]
# RISC Zero's accelerated blst and SHA-256, the same tags as guests/blst-accel.
blst = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
