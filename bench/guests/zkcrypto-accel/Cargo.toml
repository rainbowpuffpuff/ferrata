[package]
name = "zkcrypto_accel"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

# A guest is its own workspace, so its [patch.crates-io] applies to ferrata-core too.
[workspace]

[dependencies]
bench-core = { path = "../bench-core", features = ["zkcrypto"] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
# Pin the versions the patches provide, so the resolver selects them.
sha2 = "=0.10.8"
sha2_09 = { package = "sha2", version = "=0.9.9", default-features = false }
bls12_381 = { version = "=0.8.0", default-features = false }

[patch.crates-io]
# RISC Zero's accelerated zkcrypto bls12_381 (newest tag of the fork).
bls12_381 = { git = "https://github.com/risc0/zkcrypto-bls12_381", tag = "bls12_381/v0.8.0-risczero.1" }
# RISC Zero's accelerated SHA-256: 0.10 for SSZ hashing, 0.9 for hash-to-curve's expand_message_xmd.
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
sha2_09 = { package = "sha2", git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.9.9-risczero.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
