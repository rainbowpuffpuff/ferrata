[package]
name = "nopatch"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

# No RISC Zero patch at all: crates.io bls12_381 0.8.0 and crates.io sha2 (0.10 and 0.9).
# The fully unaccelerated baseline.
[workspace]

[dependencies]
bench-core = { path = "../bench-core", features = ["zkcrypto"] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
sha2 = "=0.10.8"
sha2_09 = { package = "sha2", version = "=0.9.9", default-features = false }
bls12_381 = { version = "=0.8.0", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
