[package]
name = "residue-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
residue-methods = { path = "../residue-methods" }
residue = { path = "../residue" }
# Executor only. Without the `prove` feature, default_executor() runs r0vm 3.0.5 over IPC.
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["client"] }
ferrata-core = { path = "../../crates/ferrata-core", features = ["blst"] }
ferrata-spectests = { path = "../../crates/ferrata-spectests" }
blst = "0.3"
sha2 = "0.10"
hex = "0.4"
