# Cycle-count bench for ferrata-core inside a RISC Zero zkVM 3.0.5 guest (executor only).
# The guests under guests/ are separate workspaces (each with its own [patch.crates-io]);
# methods/ builds them with risc0-build and embeds the ELFs, host/ runs them.
[workspace]
resolver = "2"
members = ["host", "methods", "residue", "residue-agg", "residue-handoff", "residue-methods", "residue-host", "misbehaviour"]
# Each guest is a workspace of its own (own lockfile and [patch.crates-io]).
exclude = ["guests"]

[profile.dev]
opt-level = 3

[profile.release]
opt-level = 3
