[package]
name = "residue-agg"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "Experimental, unaudited: a cheaper composition of a light-client update's signing key (bench only; no deployed program uses it)"

[dependencies]
# The guest (guests/residue-accel) patches in RISC Zero's accelerated blst and SHA-256; natively,
# crates.io's. ferrata-core is used unchanged (its public API only).
ferrata-core = { path = "../../crates/ferrata-core", default-features = false, features = ["blst"] }
blst = "0.3"
# `compress` exposes sha2::compress256 (the SHA-256 compression function), nothing else.
sha2 = { version = "0.10", default-features = false, features = ["compress"] }

[dev-dependencies]
ferrata-core = { path = "../../crates/ferrata-core", features = ["blst"] }
ferrata-spectests = { path = "../../crates/ferrata-spectests" }
num-bigint = "0.4"
hex = "0.4"
sha2 = "0.10"
serde_yaml = "0.9"
blst = "0.3"
