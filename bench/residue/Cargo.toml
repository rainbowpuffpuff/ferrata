[package]
name = "residue"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "Experimental, unaudited: the residue-witness check of a BLS12-381 pairing product (bench only; no deployed program uses it)"

[dependencies]
# The guest patches in RISC Zero's accelerated blst (guests/residue-accel); natively, crates.io blst.
blst = "0.3"

[dev-dependencies]
ferrata-core = { path = "../../crates/ferrata-core", features = ["blst"] }
ferrata-spectests = { path = "../../crates/ferrata-spectests" }
num-bigint = "0.4"
hex = "0.4"
sha2 = "0.10"
serde_json = "1"
