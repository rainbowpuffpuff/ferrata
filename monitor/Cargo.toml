# monitor: the watchers' node-side program for the Ferrata vault (prototype, unaudited).
#
# Its own workspace, like cli/: it links alloy, which the rest of the repository avoids, and the
# attestor core (rule (B)'s certificate and final-tier message) by path.
[package]
name = "ferrata-monitor"
description = "monitor: checks each candidate checkpoint submitted to a Ferrata vault against its own node's view and cancels or escalates within the window"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
name = "ferrata_monitor"
path = "src/lib.rs"

[[bin]]
name = "monitor"
path = "src/main.rs"

[dependencies]
attestor-core = { path = "../checkpoint/crates/attestor-core" }
alloy = { version = "1", features = ["contract", "provider-http", "rpc-types", "signer-local", "signer-keystore", "network", "sol-types"] }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "time", "signal"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
ed25519-dalek = { version = "2.2.0", default-features = false }
