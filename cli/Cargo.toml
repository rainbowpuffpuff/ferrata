# ferrata: the user's and the relayer's command-line tool for the Ferrata bridge (prototype, unaudited).
#
# Its own workspace, like lez/live/driver: it links LEZ's wallet library (and with it LEZ's node-side
# crates) and alloy, which the rest of the repository avoids. The LEZ clone sits at
# upstream/lez-v0.4.0-rc1 beside the repository, as for lez/.
[package]
name = "ferrata-cli"
description = "ferrata: keys, deposit, scan and recover, claim, burn, release and status for the Ferrata bridge"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[[bin]]
name = "ferrata"
path = "src/main.rs"
required-features = ["lez-wallet"]

[[bin]]
name = "ferrata-relayer"
path = "src/bin/relayer.rs"

# The gas drop's off-chain steps (M0 check 2): the claimant's receipt, proven for real, and the relayer's drop
# (relayer::gas_drop) with the native credit sent by an external command (lez/crown/driver gas-drop-credit on
# LEZ v0.4.0-rc3). Builds without `lez-wallet`.
[[bin]]
name = "ferrata-gasdrop"
path = "src/bin/gasdrop.rs"

[[example]]
name = "miniapp_devnet"
required-features = ["lez-wallet"]

# The devnet tools of e2e/seqnet (the user's round trip on a running LEZ sequencer): the gas drop's stand-in
# and the zone's transaction list. Built only with `--features seqnet`.
[[bin]]
name = "seqnet-fund"
path = "src/bin/seqnet_fund.rs"
required-features = ["seqnet"]

[[bin]]
name = "seqnet-txs"
path = "src/bin/seqnet_txs.rs"
required-features = ["seqnet"]

[[bin]]
name = "seqnet-chain"
path = "src/bin/seqnet_chain.rs"
required-features = ["seqnet"]

[dependencies]
ferrata-bridge-core = { path = "../bridge/crates/ferrata-bridge-core" }
ferrata-lez-bridge-wire = { path = "../lez/bridge-wire" }
# The attestation program's interface and the core's store and record encodings (`status`: the
# instance's finalized header and its newest record), as lez/bridge-wire links them.
ferrata-lez-wire = { path = "../lez/wire" }
ferrata-core = { path = "../crates/ferrata-core", default-features = false }
# The wallet rules and bridge calls the tool shares with ferrata_bridge_module (one implementation):
# the release rule, the claim builder, the root import, the release guest run (`prove`).
ferrata-wallet = { path = "wallet", features = ["prove"] }

# LEZ by path (v0.4.0-rc1, commit 1806e87), as lez/live/driver links it. The wallet library (with `common`, the
# sequencer's RPC client and the key trees) only with the `lez-wallet` feature: it links LEZ's node-side crates
# (RocksDB, libp2p).
wallet = { path = "../../upstream/lez-v0.4.0-rc1/lez/wallet", optional = true }
common = { path = "../../upstream/lez-v0.4.0-rc1/lez/common", optional = true }
sequencer_service_rpc = { path = "../../upstream/lez-v0.4.0-rc1/lez/sequencer/service/rpc", features = ["client"], optional = true }
lee = { path = "../../upstream/lez-v0.4.0-rc1/lee/state_machine" }
lee_core = { path = "../../upstream/lez-v0.4.0-rc1/lee/state_machine/core", features = ["host"] }
key_protocol = { path = "../../upstream/lez-v0.4.0-rc1/lee/key_protocol", optional = true }
# `ferrata attest` (src/attest.rs): LEZ's block application for the follower (lez/live/driver/src/follower.rs, included),
# the updater's job planning, and the proofs' tries.
chain_state = { path = "../../upstream/lez-v0.4.0-rc1/lez/chain_state", optional = true }
fee_core = { path = "../../upstream/lez-v0.4.0-rc1/lez/programs/fee/core", optional = true }
testnet_initial_state = { path = "../../upstream/lez-v0.4.0-rc1/lez/testnet_initial_state", optional = true }
# Only with `lez-wallet` (src/attest.rs): ferrata_relayer_module builds the library without it and stages only the
# crates it then links (modules/scripts/stage-relayer.sh; scripts/ci/modules-resolve.sh checks it).
ferrata-advance = { path = "../lez/advance", optional = true }
ferrata-spectests = { path = "../crates/ferrata-spectests", optional = true }

# Ethereum: keystore, signing, JSON-RPC and ABI.
alloy = { version = "1", features = ["contract", "provider-http", "rpc-types", "signer-local", "signer-keystore", "network"] }
# Executes or proves the release guest in r0vm 3.0.5 (installed with rzup), over IPC, as bridge/e2e does.
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["client"] }
# The relayer wraps a holder's succinct release receipt: identity_p254 through r0vm, the Groth16 step's
# input and output (risc0-groth16's JSON), as bridge/e2e does.
risc0-groth16 = { version = "3.0", features = ["prove"] }
bincode = "1.3"

bip39 = "2.2"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net", "io-util"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
borsh = { version = "=1.6.1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
url = "2.5"

[features]
# The sequencer path: LEZ's wallet library (signing and sending on LEZ, syncing private accounts) and the seed's
# LEZ keys (`seed`, `scan`, `flow`, the `ferrata` binary). Without it the library keeps the Ethereum side, the
# zone's reads and the bridge calls over any `lez::Ledger`, and the relayer daemon with the devnet zone:
# ferrata_relayer_module builds it so (modules/scripts/stage-relayer.sh).
default = ["lez-wallet"]
lez-wallet = ["dep:wallet", "dep:common", "dep:sequencer_service_rpc", "dep:key_protocol", "dep:chain_state", "dep:fee_core", "dep:testnet_initial_state", "dep:ferrata-advance", "dep:ferrata-spectests"]
# The devnet tools of e2e/seqnet (seqnet-fund, seqnet-txs, seqnet-chain): they sign, send and sync with LEZ's
# wallet library.
seqnet = ["lez-wallet"]
# The few calls whose LEZ API differs between tags, as lez/'s crates (lez/scripts/lez-select.sh): none for
# v0.4.0-rc1 (as committed); a build against v0.4.0-rc3 (its LEZ paths pointed there, as modules/scripts/live-testnet.sh
# does in a copy of the tree) enables `lez-rc3`.
lez-rc2 = []
lez-rc3 = ["lez-rc2"]

[dev-dependencies]
# The LEZ side of the end-to-end test: LEZ's state transition with the bridge guest (dev mode).
harness = { path = "../lez/harness" }
rand = "0.8"

# As in LEZ's workspace, so that the wallet is built with the dependencies LEZ builds it with.
[patch.crates-io]
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
