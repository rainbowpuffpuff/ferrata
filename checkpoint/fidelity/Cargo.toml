[package]
name = "fidelity"
version = "0.1.0"
description = "Host-only: builds real-format LEZ v0.4.0-rc1 blocks and Logos Blockchain (d480efc6) transactions with the upstream crates, checks checkpoint-core against them, and writes the bench fixtures"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
checkpoint-core = { path = "../crates/checkpoint-core", features = ["std"] }
# LEZ v0.4.0-rc1 (tag clone, read-only), by path.
common = { path = "../../../upstream/lez-v0.4.0-rc1/lez/common" }
chain_state = { path = "../../../upstream/lez-v0.4.0-rc1/lez/chain_state" }
lee = { path = "../../../upstream/lez-v0.4.0-rc1/lee/state_machine" }
lee_core = { path = "../../../upstream/lez-v0.4.0-rc1/lee/state_machine/core", features = ["host"] }
testnet_initial_state = { path = "../../../upstream/lez-v0.4.0-rc1/lez/testnet_initial_state" }
fee_core = { path = "../../../upstream/lez-v0.4.0-rc1/lez/programs/fee/core" }
system_accounts = { path = "../../../upstream/lez-v0.4.0-rc1/lez/system_accounts" }
# Logos Blockchain at the revision LEZ pins (d480efc6, shallow clone, read-only), by path.
logos-blockchain-core = { path = "../../../upstream/logos-blockchain-d480efc6/core" }
logos-blockchain-key-management-system-keys = { path = "../../../upstream/logos-blockchain-d480efc6/kms/keys" }
logos-blockchain-groth16 = { path = "../../../upstream/logos-blockchain-d480efc6/zk/groth16" }
logos-blockchain-utils = { path = "../../../upstream/logos-blockchain-d480efc6/utils" }
logos-blockchain-binary-codec = { path = "../../../upstream/logos-blockchain-d480efc6/binary-codec" }
# Same version LEZ's lockfile resolves.
borsh = { version = "=1.6.1", features = ["derive"] }
# To read LEZ's committed sequencer database dump (test_fixtures/fixtures/*.dump).
zstd = "0.13"
hex = "0.4"
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
# ci_zone (CI's round trip): rule (B) certificates and attestations, as host's gen-b makes them.
attestor-core = { path = "../crates/attestor-core" }
ed25519-dalek = { version = "2.2.0", default-features = false }

# A workspace of its own since the move to RISC Zero 3.1 (docs/design/risc0-3.1-migration.md): LEZ v0.4.0-rc1's `lee`
# pins risc0-zkos-v1compat =2.2.2 (risc0 3.0.5), while checkpoint/'s hosts use risc0-zkvm 3.1.0, which needs ^2.2.3, and
# one lockfile cannot hold both. This crate only runs checkpoint-core natively (no guest, no proof), so its lockfile
# keeps LEZ's versions until LEZ moves (phase 2). Its target directory stays checkpoint/target (.cargo/config.toml).
[workspace]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[patch."https://github.com/logos-blockchain/logos-blockchain.git"]
logos-blockchain-common-http-client = { path = "../../../upstream/logos-blockchain-d480efc6/nodes/node/http-client" }
logos-blockchain-core = { path = "../../../upstream/logos-blockchain-d480efc6/core" }
logos-blockchain-zone-sdk = { path = "../../../upstream/logos-blockchain-d480efc6/zone-sdk" }
