[package]
name = "host"
version = "0.1.0"
description = "Executes the checkpoint (rules A and B), segment and micro-benchmark guests on the fixtures; rule (B) fixtures; composition demo; proving and Groth16 wrapping"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
methods = { path = "../methods" }
methods-plain = { path = "../methods-plain" }
checkpoint-core = { path = "../crates/checkpoint-core", features = ["std"] }
# gen-b: rule (B) fixtures (certificates, attestations) and re-signed rule (A) inscriptions.
attestor-core = { path = "../crates/attestor-core" }
ed25519-dalek = { version = "2.2.0", default-features = false }
# Client only: execution and proving run in r0vm 3.1.0 (installed with rzup), over IPC.
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["client"] }
anyhow = "1"
bincode = "1.3"
hex = "0.4"
serde_json = "1"
