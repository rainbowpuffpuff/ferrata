[package]
name = "realblocks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The checkpoint program's parser, re-hashing and inscription check over the lab's real LEZ blocks, and the rule (B) input over a span of them"

[dependencies]
checkpoint-core = { path = "../crates/checkpoint-core", features = ["std", "bedrock-0-3-5"] }
attestor-core = { path = "../crates/attestor-core" }
ed25519-dalek = { version = "2.2.0", default-features = false }
anyhow = "1"
hex = "0.4"
serde_json = "1"
