# ferrata-checkpoint: prototype of the LEZ -> Ethereum checkpoint program (SPEC-v2 §4).
#
# crates/checkpoint-core   the rule, no_std, no unsafe; runs on the host and in the guests
# crates/attestor-core     rule (B)'s attestor: certificate, final-tier message v2, Ed25519; no_std
# attestor/                ferrata_attestor: the signer a sequencer runs (reads its node's final tier) and the
#                          collector of t of n attestations into a checkpoint_b input
# fidelity/                host-only: builds real-format LEZ blocks and Mantle transactions with
#                          the upstream crates and checks the core's parsers against them; writes
#                          the bench fixtures. A workspace of its own since RISC Zero 3.1: LEZ
#                          v0.4.0-rc1's crates pin risc0 3.0.5's v1compat (=2.2.2), the hosts here
#                          use risc0-zkvm 3.1.0 (^2.2.3), and one lockfile cannot hold both
# methods-segment/, methods/  build the guests in guests/ (risc0-build 3.0.7) and embed them
# methods-0-3-5/           builds the checkpoint guests of guests-0-3-5/ (zones on Logos Blockchain 0.3.5-rc.1)
# host/                    executor bench, composition demo, proving
#
# guests/ is a workspace of its own so that its [patch.crates-io] (RISC Zero's accelerated sha2
# and curve25519-dalek) applies there and nowhere else.
[workspace]
resolver = "2"
members = ["crates/checkpoint-core", "crates/attestor-core", "methods-segment", "methods", "methods-0-3-5", "methods-plain", "host", "realblocks", "attestor"]
default-members = ["crates/checkpoint-core", "crates/attestor-core"]
exclude = ["guests", "guests-plain", "guests-0-3-5", "fidelity"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3

# The upstream crates and the zkVM client are slow unoptimised.
[profile.dev.package."*"]
opt-level = 2

# The patch of LEZ v0.4.0-rc1's logos-blockchain dependency (d480efc6, by path) moved with fidelity/, its only user.
