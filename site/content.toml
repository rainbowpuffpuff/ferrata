# "Try it": commands as the guides give them; {rpc} becomes this host's test-network RPC in the browser.
[[try]]
title = "Check the work from a fresh clone"
lines = [
  "git clone https://github.com/rainbowpuffpuff/ferrata && cd ferrata",
  "scripts/fetch-vectors.sh && cargo test --workspace --locked",
]
doc = "docs/guides/quickstart.md"

[[try]]
title = "Re-check the live Sepolia round trips from any RPC (read-only)"
lines = ["python3 -I scripts/verify-sepolia.py e2e/runs/crown-live-4"]
doc = "docs/sepolia.md"

[[try]]
title = "Re-run five results in one pinned container"
lines = ["scripts/reproduce/run.sh"]
doc = "scripts/reproduce/README.md"

[[try]]
title = "The M0 checks, each verdict printed"
lines = ["just m0"]
doc = "justfile"

[[try]]
title = "Ask the test network's light client for its state"
lines = [
  "cd cli && cargo build --release",
  "./target/release/ferrata attest --lez-rpc {rpc} --program 0x<program> status --instance 0x<instance>",
]
doc = "lez/ATTEST-CLI.md"
note = "The program and the Sepolia instance are filled in from the test network's programs list when it serves one."

[[try]]
title = "The bid's day-one deployment on LEZ testnet 0.4, for when it exists (it sends transactions)"
lines = ["FERRATA_TESTNET_SEND=yes lez/testnet04/day1.sh go URL"]
doc = "lez/testnet04/README.md"
note = "Without FERRATA_TESTNET_SEND=yes it sends nothing; the README says what it deploys and in which order."

# Each milestone's current reading where an evidence row measures its gate (shown under the gate as filed).
[milestone_evidence]
M0 = [51]

# The review card quotes this document's "Reviews by agents" section (its first paragraph), nothing written here.
[review]
doc = "docs/how-it-was-built.md"
