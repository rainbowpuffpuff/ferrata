# What the build page shows beyond what it reads from docs/: which runs and screenshots to feature, their short
# captions, and the commands of "Try it". Everything else (statuses, counts, reasons, tests, evidence, milestones,
# budget) is read by site/build.py from docs/requirements-status.md, docs/EVIDENCE.md, docs/traceability.md,
# scripts/ci/row-tests.toml, site/data/*.json and the run records named below. Every path here must be tracked;
# site/test_site.py checks it. Captions say where each thing ran, with the proposal's labels: real, a zone we ran
# (devnet), dev mode, stand-in.

[site]
title = "Ferrata"
tagline = "Ethereum state attestation on LEZ, and a private ERC-20 and ETH bridge built on it"
bid = "The bid for Logos RFP-021 and RFP-022"
repo = "https://github.com/rainbowpuffpuff/ferrata"
ref = "main"
issue = "https://github.com/logos-co/rfp/issues/257"
issue_api = "https://api.github.com/repos/logos-co/rfp/issues/257"
api_repo = "https://api.github.com/repos/rainbowpuffpuff/ferrata"
workflows = ["ci.yml", "macos.yml", "lez-full.yml", "sequencer.yml"]
platform = "LEZ v0.4.0-rc1 to rc3 on zones we run (LEZ v0.4.0, released 27 November 2026, not yet ported to); no LEZ testnet 0.4 is announced"

# The test network served beside this page (same host). Paths are relative so the page works on any host name.
[testnet]
rpc = "/rpc"                                            # LEZ JSON-RPC through the host's gateway
status = "/status"                                      # the human status page
status_json = ["/status/status.json", "/status.json"]   # tried in order; the updater's /health is inside
programs_json = ["/status/programs.json", "/programs.json"]
explorer = "/explorer/"
explorer_tx = "/explorer/#/tx/{hash}"                   # the explorer's routes: #/tx/HASH, #/block/N, #/account/ID
explorer_block = "/explorer/#/block/{n}"
wallet = "/wallet/"
agents = "/agents"
agents_md = "/AGENTS.md"
faucet = "/faucet"                                      # GET: its terms and balance; POST {"account": ID}: one transfer

# "What runs today": each card takes its title, numbers, where it ran and proofs from its EVIDENCE rows (the proofs
# label too: a label here may not speak of proofs, build.py refuses it); `txs`
# names a record whose Sepolia transactions are listed (manifest.json of a crown run), `stages` a README whose
# "| Stage | Result | Time |" table is shown, `lez_txs` a TSV of LEZ transactions (hash, block, label).
[[run]]
id = "crown-live-4"
title = "The round trip, live on Sepolia, with the LEZ side on LEZ v0.4.0-rc3"
date = "2026-11-18"
evidence = [142, 141]
labels = ["Sepolia: real transactions", "LEZ v0.4.0-rc3: a zone we ran"]
record = "e2e/runs/crown-live-4/README.md"
txs = "e2e/runs/crown-live-4/manifest.json"
deploy = "e2e/runs/crown-live-4/deploy.json"
stages = "e2e/runs/crown-live-4/README.md"
recheck = "python3 -I scripts/verify-sepolia.py e2e/runs/crown-live-4"

[[run]]
id = "crown-live-3"
title = "The round trip on the final programs, live on Sepolia"
date = "2026-11-12"
evidence = [91]
labels = ["Sepolia: real transactions", "LEZ v0.4.0-rc1: a zone we ran"]
record = "e2e/runs/crown-live-3/README.md"
txs = "e2e/runs/crown-live-3/manifest.json"
deploy = "e2e/runs/crown-live-3/deploy.json"
stages = "e2e/runs/crown-live-3/README.md"
recheck = "python3 -I scripts/verify-sepolia.py e2e/runs/crown-live-3"

[[run]]
id = "crown-live-1"
title = "The first live round trip on Sepolia"
date = "2026-11-11"
evidence = [41]
labels = ["Sepolia: real transactions", "LEZ v0.4.0-rc1: a zone we ran"]
record = "e2e/runs/crown-live-1/README.md"
txs = "e2e/runs/crown-live-1/manifest.json"
deploy = "e2e/runs/crown-live-1/deploy.json"
stages = "e2e/runs/crown-live-1/README.md"
recheck = "python3 -I scripts/verify-sepolia.py e2e/runs/crown-live-1"

[[run]]
id = "lab"
title = "The lab: the light client following Sepolia and mainnet, unattended"
date = "2026-11-10"
evidence = [21]
labels = ["LEZ v0.4.0-rc1: a zone we ran", "real Ethereum data", "public job path"]
record = "lez/lab/README.md"
recheck = "lez/lab/lab.sh verify"

[[run]]
id = "public-v031"
title = "On the public LEZ testnet (v0.3.1): the light client deployed, updated and attesting"
date = "2026-11-19"
evidence = [150]
labels = ["public LEZ testnet v0.3.1", "experimental port", "11 transactions"]
record = "lez-v03/results/public/README.md"
lez_txs = "lez-v03/results/public/txs.tsv"
explorer = "https://explorer.testnet.lez.logos.co/"

[[run]]
id = "one-block"
title = "Four private attestations in one block of LEZ v0.4.0-rc3's own sequencer"
date = "2026-11-22"
evidence = [217]
labels = ["LEZ v0.4.0-rc3: a sequencer we ran"]
record = "lez/results/v0.4.0-rc3/r11-one-block/README.md"

[[run]]
id = "basecamp"
title = "The mini-app's private round trip inside Logos Basecamp"
date = "2026-11-17"
evidence = [126, 125]
labels = ["Logos Basecamp", "LEZ: a zone we ran", "Ethereum: a stand-in service on a local anvil"]
record = "modules/ferrata_bridge_ui/results-basecamp-roundtrip/real-proofs-jobs/final/README.md"
gallery = "basecamp"

[[run]]
id = "logos-core"
title = "The attestation module and the bridge's Ethereum side through Logos Core's own modules"
date = "2026-11-22"
evidence = [197, 199]
labels = ["headless Logos Core", "LEZ: sequencers we ran", "Ethereum: through eth_rpc_module"]
record = "cli/results/attest-seq-r6/README.md"

[[run]]
id = "privacy"
title = "The privacy gate: pairing deposits with claims at chance"
evidence = [89, 23]
labels = ["LEZ v0.4 state machine in process", "stand-in records"]
record = "docs/privacy/RESULTS.md"

[[run]]
id = "four-sequencers"
title = "The return leg with four sequencers: a checkpoint signed by 3 of 4, proven and accepted"
date = "2026-11-13"
evidence = [100, 101]
labels = ["LEZ v0.4.0-rc1: four sequencers we ran", "vault on a local EVM"]

# The attestation CLI, as recorded: each block is a file of a recorded run, shown verbatim.
[cli]
title = "`ferrata attest` against a LEZ v0.4.0-rc1 sequencer we ran"
evidence = [195]
record = "cli/results/attest-seq-rf1/README.md"
steps = [
  "cli/results/attest-seq-rf1/cli/12-mainnet-status.txt",
  "cli/results/attest-seq-rf1/cli/14-attest-storage.txt",
  "cli/results/attest-seq-rf1/cli/15-attest-storage-predicate-fails.txt",
  "cli/results/attest-seq-rf1/cli/17-attest-log-transfer.txt",
]

