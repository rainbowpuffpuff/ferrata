# The web clients' LEZ v0.4.0 test vectors, made by LEZ v0.4.0's own code (keys, account ids, key states, public and
# privacy-preserving transactions, their signing values, a block with receipts, a receipt's JSON):
#
#   cargo run --release --locked > ../wallet/test/fixtures/lez-v040-vectors.json
#
# LEZ v0.4.0 (commit a255b42c) sits at upstream/lez-v0.4.0 beside the repository, as for lez/. The lockfile is LEZ
# v0.4.0's own, reduced to what these crates use. Host code only; nothing here is deployed.
[package]
name = "lez040-vectors"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
lee = { path = "../../../../../upstream/lez-v0.4.0/lee/state_machine" }
lee_core = { path = "../../../../../upstream/lez-v0.4.0/lee/state_machine/core", features = ["host"] }
key_protocol = { path = "../../../../../upstream/lez-v0.4.0/lee/key_protocol" }
common = { path = "../../../../../upstream/lez-v0.4.0/lez/common" }
borsh = "1.5.7"
serde_json = "1.0.81"
hex = "0.4.3"

# As in LEZ's workspace.
[patch.crates-io]
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }
curve25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", rev = "385adda1fa3b66d9aaa8b8fcc99ddc324d33ba32" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", rev = "3ab63a6f1048833f7047d5a50532e4a4cc789384" }
