[package]
name = "ferrata-modal"
version = "0.1.0"
description = "Proves ferrata-checkpoint fixtures with uploaded guest binaries (risc0-zkvm 3.0.5, in-process prover, CUDA with --features cuda) and verifies the receipts"
edition = "2021"
# RISC Zero's own toolchain at the v3.0.5 tag (rust-toolchain.toml: channel 1.89); the lockfile is
# resolved for it.
rust-version = "1.89"
resolver = "3"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
# risc0-zkvm's `cuda` feature (implies `prove`): the in-process prover with the rv32im, recursion,
# keccak and zkp CUDA kernels. Without it the binary only computes image ids and verifies receipts.
cuda = ["risc0-zkvm/cuda"]

[dependencies]
# std only: verification and image ids. `cuda` adds `prove` (and with it `client`).
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
anyhow = "1"
bincode = "1.3"
hex = "0.4"
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
