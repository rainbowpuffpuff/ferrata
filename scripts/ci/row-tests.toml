# The row-to-test map of RFP-021 and RFP-022 (Reliability #11 of RFP-022: "Every hard requirement has
# at least one corresponding test"; read with docs/traceability.md's "Named test or artefact" column
# and docs/requirements-status.md's "Evidence" column).
#
# One [[row]] per hard row (IDs as in traceability.md, soft rows excluded). `tests` names at least one
# test each; every `path` is a tracked file: a test file, a test script, or a recorded run's file.
# `ci` is the CI job (a job defined in a workflow under .github/workflows/) that runs it, or "box" /
# "local" when it runs only on the build box or by hand, in which case `run` gives the exact command
# from the docs. Rows that wait on the public LEZ testnet or another upstream component say so in their
# `note`, mapped to the rehearsal the Evidence column names. Entries with `branch` live on another
# branch of this project and are printed as pending: the checker does not require them here.
#
# Checked by scripts/ci/check-row-tests.py, run by CI's `links` job:
#   python3 -I scripts/ci/check-row-tests.py

# ---------------------------------------------------------------------------
