[package]
name = "ferrata-v03-wire"
description = "Instructions, effects, state and addresses of Ferrata's light-client program on LEZ v0.3.1 (guest and host)"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The verification core. The guest selects the blst backend (RISC Zero's fork); the host, native blst.
ferrata-core = { path = "../../crates/ferrata-core", default-features = false }
# LEZ v0.3.1 (tag v0.3.1, commit 1a003bfb), by path: the clone must sit at upstream/lez-v0.3.1 beside the
# repository (../../../upstream from here).
lee_core = { path = "../../../upstream/lez-v0.3.1/lee/state_machine/core" }
borsh = { version = "1.5.7", features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
