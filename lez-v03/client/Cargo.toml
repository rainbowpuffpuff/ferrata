[package]
name = "client-v03"
description = "ferrata-v03: deploys and drives the LEZ v0.3.1 light-client program on a sequencer through LEZ v0.3.1's wallet"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "ferrata-v03"
path = "src/main.rs"

[dependencies]
ferrata-v03-wire = { path = "../wire" }
methods-v03 = { path = "../methods" }
harness-v03 = { path = "../harness" }
ferrata-core = { path = "../../crates/ferrata-core" }
residue = { path = "../../bench/residue" }
residue-agg = { path = "../../bench/residue-agg" }
lee = { path = "../../../upstream/lez-v0.3.1/lee/state_machine" }
lee_core = { path = "../../../upstream/lez-v0.3.1/lee/state_machine/core", features = ["host"] }
common = { path = "../../../upstream/lez-v0.3.1/lez/common" }
wallet = { path = "../../../upstream/lez-v0.3.1/lez/wallet" }
sequencer_service_rpc = { path = "../../../upstream/lez-v0.3.1/lez/sequencer/service/rpc", features = ["client"] }
program_loader_core = { path = "../../../upstream/lez-v0.3.1/lez/programs/program_loader/core" }
risc0-binfmt = "3.0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
anyhow = "1"
borsh = { version = "1.5.7", features = ["derive"] }
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
