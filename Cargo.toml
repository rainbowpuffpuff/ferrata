[workspace]
resolver = "2"
members = ["crates/ferrata-core", "crates/ferrata-spectests"]
# bench/, lez/, bridge/ and checkpoint/ are workspaces of their own (RISC Zero guests and hosts), and so is
# gpu-prover/prover (the Modal GPU prover, with its own lockfile); see their READMEs. vault/ is a Foundry project;
# docs/design/finality-rule/ is Python.
exclude = ["bench", "lez", "bridge", "checkpoint", "gpu-prover"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
# Measured on 22 November 2026: `cargo +1.85.0 check --workspace --locked` passes (1.85: the edition 2024 of
# zeroize_derive and indexmap 2.14.2); the tests' dev-dependencies need 1.91 (alloy 2.1 through the Helios oracle:
# `cargo +1.91.0 check --workspace --all-targets --locked` passes, 1.88 does not).
rust-version = "1.85"
repository = "https://github.com/rainbowpuffpuff/ferrata"

# BLS is slow unoptimised; optimise dependencies even in test builds.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1
