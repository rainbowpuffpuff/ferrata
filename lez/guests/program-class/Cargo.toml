[package]
name = "ferrata_lez_class"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# The second build of the attestation program (not deployed): ../program's own src/main.rs, source
# for source, compiled against ../../wire-class under the name `ferrata_lez_wire`, whose `attest`
# replies with each statement's nullifier-safety class (and whose root-transaction event,
# `FRT-ATC1`, carries the classes). Same verification, same identifiers, same refusal codes. A
# workspace of its own, so that ../program (the deployed program of docs/image-ids.md), its lockfile
# and its feature resolution stay as they are; its lockfile is ../program's with this package's
# name and ferrata-lez-wire-class added. Built by risc0-build from ../../methods-program-class.
[workspace]

[[bin]]
name = "ferrata_lez_class"
path = "../program/src/main.rs"

[dependencies]
ferrata-lez-wire = { package = "ferrata-lez-wire-class", path = "../../wire-class" }
ferrata-core = { path = "../../../crates/ferrata-core", default-features = false, features = ["blst"] }
lee_core = { path = "../../../../upstream/lez-v0.4.0-rc1/lee/state_machine/core" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
borsh = { version = "=1.6.1", features = ["derive"] }
sha2 = "=0.10.8"
blst = "=0.3.16"
tiny-keccak = "=2.0.2"

[patch.crates-io]
blst = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
