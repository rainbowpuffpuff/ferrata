# The second build of the bridge program (not deployed): ../bridge's program with the nullifier and holder accounts
# keyed by the configuration id as well (bridge-wire's feature `config-keyed`, src/config_keyed.rs), the fix of the
# two known issues of docs/design/bridge.md §3. A workspace of its own, so that ../bridge (the deployed program of
# docs/image-ids.md), its lockfile and its feature resolution stay as they are; its lockfile is ../bridge's with only
# the package's name changed. Built by risc0-build from ../../methods-bridge-next.
[package]
name = "ferrata_bridge_next"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
ferrata-lez-bridge-wire = { path = "../../bridge-wire", features = ["config-keyed"] }
ferrata-lez-wire = { path = "../../wire" }
lee_core = { path = "../../../../upstream/lez-v0.4.0-rc1/lee/state_machine/core" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
borsh = { version = "=1.6.1", features = ["derive"] }
sha2 = "=0.10.8"

[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
