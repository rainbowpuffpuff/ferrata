[package]
name = "ferrata_bridge"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

# The program's source; on LEZ v0.4.0 its generated twin src/main_lez040.rs (lez/scripts/lez040-sources.py: LEZ #1144's API),
# which lez/scripts/lez-select.sh points the marked line at. The release candidates build src/main.rs itself.
[[bin]]
name = "ferrata_bridge"
path = "src/main.rs" # lez-select

[dependencies]
ferrata-lez-bridge-wire = { path = "../../bridge-wire" }
ferrata-lez-wire = { path = "../../wire" }
lee_core = { path = "../../../../upstream/lez-v0.4.0-rc1/lee/state_machine/core" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
borsh = { version = "=1.6.1", features = ["derive"] }
sha2 = "=0.10.8"

[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
