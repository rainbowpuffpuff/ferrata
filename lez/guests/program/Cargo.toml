[package]
name = "ferrata_lez"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# A guest is its own workspace, so its [patch.crates-io] applies to ferrata-core and lee_core too.
[workspace]

[dependencies]
ferrata-lez-wire = { path = "../../wire" }
ferrata-core = { path = "../../../crates/ferrata-core", default-features = false, features = ["blst"] }
lee_core = { path = "../../../../upstream/lez-v0.4.0-rc1/lee/state_machine/core" }
# LEZ v0.4.0-rc1 pins risc0-zkvm 3.0.5.
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
borsh = { version = "=1.6.1", features = ["derive"] }
# Pin the versions the patches provide, so the resolver selects them.
sha2 = "=0.10.8"
blst = "=0.3.16"

[patch.crates-io]
# RISC Zero's accelerated blst (the configuration `bench/` cites).
blst = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }
# RISC Zero's accelerated SHA-256 (zkVM 3.0 precompile table).
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
