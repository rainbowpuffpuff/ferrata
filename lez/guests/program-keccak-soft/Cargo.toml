[package]
name = "ferrata_lez_keccak_soft"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# The program of ../program, source for source, without RISC Zero's accelerated Keccak: every
# Keccak-f permutation of a Merkle-Patricia proof is computed in the guest. Only for the
# comparison of `lez/RESULTS.md` (what an attestation costs where the Keccak accelerator is not
# available); the program the other measurements deploy is ../program.
[workspace]

# The source is the other guest's own file: nothing is copied.
[[bin]]
name = "ferrata_lez_keccak_soft"
path = "../program/src/main.rs"

[dependencies]
ferrata-lez-wire = { path = "../../wire" }
ferrata-core = { path = "../../../crates/ferrata-core", default-features = false, features = ["blst"] }
lee_core = { path = "../../../../upstream/lez-v0.4.0-rc1/lee/state_machine/core" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
borsh = { version = "=1.6.1", features = ["derive"] }
sha2 = "=0.10.8"
blst = "=0.3.16"

[patch.crates-io]
blst = { git = "https://github.com/risc0/blst", tag = "v0.3.16-risczero.0" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
