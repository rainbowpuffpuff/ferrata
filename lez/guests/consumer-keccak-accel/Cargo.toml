[package]
name = "ferrata_consumer_keccak_accel"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# The consumer of ../consumer, source for source, with RISC Zero's accelerated Keccak. Only for the
# comparison of `lez/RESULTS.md`: the user cycles a private attestation would take with the
# accelerator. Proving it also needs RISC Zero's Keccak circuit inside LEZ's privacy-preserving
# circuit, which was not tried; the consumer the other measurements deploy is ../consumer.
[workspace]

# The source is the other guest's own file: nothing is copied.
[[bin]]
name = "ferrata_consumer_keccak_accel"
path = "../consumer/src/main.rs"

[dependencies]
ferrata-lez-wire = { path = "../../wire" }
lee_core = { path = "../../../../upstream/lez-v0.4.0-rc1/lee/state_machine/core" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
borsh = { version = "=1.6.1", features = ["derive"] }
sha2 = "=0.10.8"
tiny-keccak = "=2.0.2"

[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
