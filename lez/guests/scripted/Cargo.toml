[package]
name = "scripted"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# LEZ v0.4.0-rc1's own `scripted` test program (test_programs/guest/src/bin/scripted.rs), built
# here: it replies with whatever Response its message scripts. The tests use it as an actor of
# another program that sends this program's internal messages.
[workspace]

[dependencies]
lee_core = { path = "../../../../upstream/lez-v0.4.0-rc1/lee/state_machine/core" }
test_guest_core = { path = "../../../../upstream/lez-v0.4.0-rc1/test_guest_core" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
borsh = { version = "=1.6.1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
