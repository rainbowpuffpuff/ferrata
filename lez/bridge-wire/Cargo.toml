[package]
name = "ferrata-lez-bridge-wire"
description = "Messages, actor state, addresses and the claim and import checks of the Ferrata bridge program on LEZ v0.4 (guest and host)"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The attestation program's interface (`attest::Request`, `Attestation`, `header_actor`, `Message::Attest`).
ferrata-lez-wire = { path = "../wire" }
# The light client's record of a finalized header and its execution view (`witness::HeaderRecord`,
# `attest::HeaderRecord`): the bridge's clock is the execution timestamp of an attested record.
ferrata-core = { path = "../../crates/ferrata-core", default-features = false }
# The bridge core (SPEC-v2): commitments, leaves, the claim statement, configId. no_std here.
ferrata-bridge-core = { path = "../../bridge/crates/ferrata-bridge-core", default-features = false }
# LEZ v0.4.0-rc1 by path (see ../wire/Cargo.toml).
lee_core = { path = "../../../upstream/lez-v0.4.0-rc1/lee/state_machine/core" }
borsh = { version = "=1.6.1", features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
