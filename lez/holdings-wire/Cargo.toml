[package]
name = "ferrata-lez-holdings-wire"
description = "Messages, actor state and the acceptance check of ferrata_holdings, a LEZ program that reads an ERC-20 balance through Ferrata's attestation (guest and host)"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The attestation program's public interface (`attest::Request`, `Attestation`, `header_actor`,
# `Message::Attest`): all this program needs of Ferrata.
ferrata-lez-wire = { path = "../wire" }
# Keccak-256, for the Solidity mapping key of a balance (`ferrata_core::keccak::keccak256`).
ferrata-core = { path = "../../crates/ferrata-core", default-features = false }
# LEZ v0.4.0-rc1 by path (see ../wire/Cargo.toml).
lee_core = { path = "../../../upstream/lez-v0.4.0-rc1/lee/state_machine/core" }
borsh = { version = "=1.6.1", features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
