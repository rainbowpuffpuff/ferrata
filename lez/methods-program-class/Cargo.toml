[package]
name = "methods-program-class"
description = "Builds the second build of the attestation program (guests/program-class: ferrata_lez_class, not deployed) with risc0-build 3.0.5, apart from `methods`, whose seven guests (the deployed programs among them) it leaves as they are"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[build-dependencies]
risc0-build = { version = "=3.0.5" }

[package.metadata.risc0]
methods = ["../guests/program-class"]
