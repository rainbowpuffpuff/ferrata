[package]
name = "methods-rebate"
description = "Builds ferrata_rebate (a rebate, from a pool anyone funds, to whoever lands a light-client update through it; RFP-021 soft requirement 5) with risc0-build 3.0.5, apart from `methods`, whose guests (the deployed programs among them) it leaves as they are"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[build-dependencies]
risc0-build = { version = "=3.0.5" }

[package.metadata.risc0]
methods = ["../guests/rebate"]
