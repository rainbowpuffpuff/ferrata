# Drives the Ferrata LEZ program on a running LEZ sequencer through LEZ's own wallet library and
# RPC client, follows the chain with LEZ's block application (chain_state), and re-checks a
# recorded run offline. Its own workspace: it links LEZ's node-side crates (the wallet, common,
# chain_state: libp2p, RocksDB, the Logos circuits), which ../../ (wire, methods, harness) avoids.
[package]
name = "live-driver"
description = "Runs the Ferrata LEZ program on a running LEZ sequencer and records what the sequencer did"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
ferrata-lez-wire = { path = "../../wire" }
ferrata-core = { path = "../../../crates/ferrata-core", features = ["blst"] }

# LEZ by path: the clone sits at upstream/lez-v0.4.0-rc1 beside the repository (see ../env.sh for
# running against another tag).
wallet = { path = "../../../../upstream/lez-v0.4.0-rc1/lez/wallet" }
common = { path = "../../../../upstream/lez-v0.4.0-rc1/lez/common" }
chain_state = { path = "../../../../upstream/lez-v0.4.0-rc1/lez/chain_state" }
sequencer_service_rpc = { path = "../../../../upstream/lez-v0.4.0-rc1/lez/sequencer/service/rpc", features = ["client"] }
testnet_initial_state = { path = "../../../../upstream/lez-v0.4.0-rc1/lez/testnet_initial_state" }
lee = { path = "../../../../upstream/lez-v0.4.0-rc1/lee/state_machine" }
lee_core = { path = "../../../../upstream/lez-v0.4.0-rc1/lee/state_machine/core", features = ["host"] }
fee_core = { path = "../../../../upstream/lez-v0.4.0-rc1/lez/programs/fee/core" }
system_accounts = { path = "../../../../upstream/lez-v0.4.0-rc1/lez/system_accounts" }
program_loader_core = { path = "../../../../upstream/lez-v0.4.0-rc1/lez/programs/program_loader/core" }
# LEZ's `Script`, the message of its `scripted` test program (an actor of another program).
test_guest_core = { path = "../../../../upstream/lez-v0.4.0-rc1/test_guest_core" }

risc0-binfmt = "3.0.2"
risc0-zkos-v1compat = "=2.2.2"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "time"] }
anyhow = "1"
borsh = { version = "1.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
hex = "0.4"
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"

[features]
# The calls whose LEZ API differs between the tags this crate builds against. The default is set
# with the path dependencies by ../../scripts/lez-select.sh (none: v0.4.0-rc1; `lez-rc2`: v0.4.0-rc2).
default = [] # lez-select
lez-rc2 = []

# As in LEZ's workspace, so that the wallet is built with the dependencies LEZ builds it with.
[patch.crates-io]
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }

[profile.release]
opt-level = 3
