# ferrata-updater: one file configures the daemon. Every field is shown with its default where it
# has one. Paths are relative to this file.

[daemon]
name = "updater-1"                  # in logs and metrics
state_dir = "state"                 # committee cache and journal, one subdirectory per chain
poll_secs = 12                      # seconds between rounds (a beacon slot)
listen = "127.0.0.1:9464"           # /health (JSON; 503 when an instance is down or no round refreshed it) and /metrics
ledger = "sequencer"                # "sequencer": a LEZ sequencer ([sequencer]; the build of sequencer/); "harness": dev mode

[sequencer]                         # daemon.ledger = "sequencer"
rpc = "http://127.0.0.1:3040"       # the sequencer's JSON-RPC (sequencer_service start --rpc-listen-address); loopback only
program = "A5E62aMHKFUPwtuMZRUTSPsGwkpzeGBWmbVzD8F5tKcX"  # the attestation program's account (base58 or 0x-hex), from its deployment
wait_final = true                   # read the chain and settle transactions only in blocks final on Bedrock
# run_dir = "state/ledger"          # the backend's follower of the chain and its manifest (default <state_dir>/ledger)
# log = "sequencer.log"             # the sequencer's log: the reason of a transaction it dropped

[keys]
payer_key_file = "payer.key"        # 32-byte secret key, hex; signs and pays every transaction

[fees]
gas_limit = 4800000                 # declared by every step; the largest step measured is 3,731,712
max_fee_per_tx = 1000000000         # declared maximum fee of every transaction
budget = 1000000000000              # total the daemon may spend from its start; then it stops sending

[policy]
defer_window = 8                    # rounds over which updaters spread who sends each step (1: never wait)
max_lag_slots = 64                  # a source this far behind the best verified update is "lagging"
min_agreeing = 1                    # sources that must serve the chosen finalized header before it is sent
retry_base_ms = 500                 # backoff after a transport failure or a failed read: base * 2^(attempt-1) ...
retry_max_ms = 30000                # ... capped here
max_attempts = 5
demote_rounds = 50                  # rounds a source that served something the program refuses is not asked
max_periods_per_request = 16        # periods per `updates` request
finish_own_jobs = true              # finish a job this updater sent a step for before another (its update is kept in state_dir)
min_distinct_clients = 0            # client diversity: 0 (off) or at least 2 sources of different clients, as each reports at
                                    # /eth/v1/node/version, must agree on an update before it is sent (Init and committees exempt)
client_match = "bytes"              # what they agree on: "bytes" (its SSZ, byte for byte; light-client sources) or
                                    # "finalized-header" (served, or held canonical by a "headers" source)

[[chain]]
name = "sepolia"
preset = "sepolia"                  # "mainnet" or "sepolia" (fork schedule, genesis, chain id)
checkpoint = "3b901f5e6853b5cf5eb04d7ccfe1272e66c38291cb3a11dd159cacd1117ccf7c"  # crates/ferrata-spectests/fixtures/sepolia-2026-11-12
layout = "gloas"                    # the checkpoint bootstrap's light-client layout (default "electra"); the instance id hashes it
adoption_parts = 2                  # committee adoption in 2 transactions of 256 keys

  [[chain.source]]
  name = "lodestar"
  url = "https://lodestar-sepolia.chainsafe.io"
  timeout_secs = 30
  kind = "light-client"             # serves bootstraps, updates, finality updates (default)

  [[chain.source]]
  name = "publicnode"               # serves no light-client data: confirms the finalized header (min_agreeing)
  url = "https://ethereum-sepolia-beacon-api.publicnode.com"
  kind = "headers"

  # [[chain.source]]                # optional: an execution endpoint, which confirms an update's finalized header by
  # name = "ethpandaops"            # its execution block (held canonical at its number) and counts towards
  # url = "https://rpc.sepolia.ethpandaops.io"   # min_agreeing; inside Logos Core: via = "eth_rpc_module" and
  # kind = "execution"              # chain_id = 11155111 instead of url (the endpoint eth_rpc_module holds)

[[chain]]
name = "mainnet"
preset = "mainnet"
checkpoint = "4baa732e5dbdbe97932abcf62c7caccc1cba8e9c14118d153aea629e25a4abff"

  [[chain.source]]
  name = "lodestar"
  url = "https://lodestar-mainnet.chainsafe.io"

  [[chain.source]]
  name = "publicnode"
  url = "https://ethereum-beacon-api.publicnode.com"
  kind = "headers"
