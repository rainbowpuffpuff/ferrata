# ferrata-updater: the light-client updater daemon. Follows Ethereum through several beacon API
# sources, verifies every candidate with the program's own step code before paying for it, and
# drives the attestation program's public job (`Init`, `Open`, `Miller`, `Adopt`, `Finish`) as
# LEZ public transactions. Its chain backend is a trait (`Ledger`); the `harness` feature gives the
# in-process LEZ v0.4.0-rc1 state machine with LEZ's fee settlement (tests, dev mode).
[package]
name = "ferrata-updater"
description = "Keeps Ferrata light-client instances on LEZ following Ethereum: several sources, cross-checked, cooperative with other updaters"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "ferrata-updater"
path = "src/main.rs"

[dependencies]
ferrata-lez-wire = { path = "../wire" }
# The update's job planning and step transactions, shared with ferrata_attest_module (`advance`).
ferrata-advance = { path = "../advance" }
ferrata-core = { path = "../../crates/ferrata-core", features = ["blst"] }
lee = { path = "../../../upstream/lez-v0.4.0-rc1/lee/state_machine" }
lee_core = { path = "../../../upstream/lez-v0.4.0-rc1/lee/state_machine/core", features = ["host"] }
borsh = { version = "=1.6.1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
hex = "0.4"
sha2 = "0.10"
# SIGTERM and SIGINT: finish the round in hand, then stop.
libc = "0.2"
# The in-process LEZ chain (feature `harness`): the harness's program images and settlement.
harness = { path = "../harness", optional = true }
fee_core = { path = "../../../upstream/lez-v0.4.0-rc1/lez/programs/fee/core", optional = true }
system_accounts = { path = "../../../upstream/lez-v0.4.0-rc1/lez/system_accounts", optional = true }
programs = { path = "../../../upstream/lez-v0.4.0-rc1/lez/programs", default-features = false, features = ["artifacts"], optional = true }

[features]
default = []
harness = ["dep:harness", "dep:fee_core", "dep:system_accounts", "dep:programs"]
