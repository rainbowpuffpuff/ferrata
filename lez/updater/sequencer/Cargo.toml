# ferrata-updater with the backend for a running LEZ sequencer (`daemon.ledger = "sequencer"`): the daemon of
# `../src/daemon.rs` over `SequencerLedger` (src/ledger.rs), which builds each transaction as the in-process
# `HarnessLedger` does, sends it to the sequencer's RPC with LEZ's wallet client, and reads its result by following the
# chain with LEZ's own block application over blocks final on Bedrock (the live driver's modules, `../../live/driver/src`,
# by path, as `../../crown/driver` uses them). The backend is a library (src/lib.rs: `open_ledger`), which the binary
# (src/main.rs) and ferrata_updater_module (modules/ferrata_updater_module, staged by its stage-updater.sh) both pass
# to the same daemon. A workspace of its own: it links LEZ's node-side crates.
[package]
name = "ferrata-updater-sequencer"
description = "ferrata-updater writing to a running LEZ sequencer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
name = "ferrata_updater_sequencer"
path = "src/lib.rs"

[[bin]]
name = "ferrata-updater"
path = "src/main.rs"

[[bin]]
name = "ferrata-day1"
path = "src/bin/ferrata-day1.rs"

[dependencies]
ferrata-updater = { path = ".." }
ferrata-lez-wire = { path = "../../wire" }
ferrata-lez-bridge-wire = { path = "../../bridge-wire" }
ferrata-core = { path = "../../../crates/ferrata-core", features = ["blst"] }

wallet = { path = "../../../../upstream/lez-v0.4.0-rc1/lez/wallet" }
common = { path = "../../../../upstream/lez-v0.4.0-rc1/lez/common" }
chain_state = { path = "../../../../upstream/lez-v0.4.0-rc1/lez/chain_state" }
sequencer_service_rpc = { path = "../../../../upstream/lez-v0.4.0-rc1/lez/sequencer/service/rpc", features = ["client"] }
testnet_initial_state = { path = "../../../../upstream/lez-v0.4.0-rc1/lez/testnet_initial_state" }
lee = { path = "../../../../upstream/lez-v0.4.0-rc1/lee/state_machine" }
lee_core = { path = "../../../../upstream/lez-v0.4.0-rc1/lee/state_machine/core", features = ["host"] }
fee_core = { path = "../../../../upstream/lez-v0.4.0-rc1/lez/programs/fee/core" }
program_loader_core = { path = "../../../../upstream/lez-v0.4.0-rc1/lez/programs/program_loader/core" }

risc0-binfmt = "3.0.2"
risc0-zkos-v1compat = "=2.2.2"
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "time"] }
anyhow = "1"
borsh = { version = "1.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
hex = "0.4"
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"

[features]
# The calls whose LEZ API differs between the tags the live driver's modules build against: set with the path
# dependencies by ../../scripts/lez-select.sh (none: v0.4.0-rc1; `lez-rc2`: v0.4.0-rc2; `lez-rc3`: v0.4.0-rc3).
default = [] # lez-select
lez-rc2 = []
lez-rc3 = ["lez-rc2"]

[patch.crates-io]
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }

[profile.release]
opt-level = 3
