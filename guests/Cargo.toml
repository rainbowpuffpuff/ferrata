[package]
name = "ferrata-guests"
version = "0.1.0"
description = "RISC Zero zkVM 3.0.5 guests: release (the release proof) and claim (test vehicle)"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

# A workspace of its own, so that [patch.crates-io] also applies to ferrata-bridge-core.
[workspace]

[[bin]]
name = "release"
path = "src/bin/release.rs"

[[bin]]
name = "claim"
path = "src/bin/claim.rs"

[dependencies]
ferrata-bridge-core = { path = "../crates/ferrata-bridge-core", default-features = false }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }
# Pin the version the patch provides, so the whole graph resolves to the patched crate.
sha2 = "=0.10.8"

[patch.crates-io]
# RISC Zero's accelerated SHA-256 (zkVM 3.0 precompile), the fork spike/ferrata/bench uses.
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
